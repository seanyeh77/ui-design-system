<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>圖示實驗室</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.opt{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.opt:hover{transform:translateY(-2px)}
.nv:hover{background:#f6f5f4}
.dk .nv:hover{background:#443f3b}
.nv.on:hover{background:transparent}
.tb:hover{background:#f6f5f4}
.dk .tb:hover{background:#443f3b}
</style>
</helmet>
<div style="min-height: 100vh; background: #f6f5f4; color: #171512; font-family: Inter, 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.55">
<main style="max-width: 1400px; margin: 0 auto; padding: 40px 32px 56px">
<div style="font-family: 'Geist Mono', 'Noto Sans TC', monospace; font-size: 13px; font-weight: 600; color: #6d645a">深入 11 · 圖示</div>
<h1 style="margin: 6px 0 0; font-size: 39px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em">圖示實驗室</h1>
<p style="margin: 8px 0 0; color: #6d645a; max-width: 900px">六套免費開源圖示，同樣 24 個圖示放進同一個介面比較。右邊的側邊欄可以點，看選中時的樣子。選好後把最下方的設定給我。</p>

<div style="margin-top: 28px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 18px; font-weight: 700; padding-top: 6px">{{sec.title}}</div>
<sc-for list="{{sec.groups}}" as="g" hint-placeholder-count="2">
<section style="padding: 16px; background: #ffffff; border: 1px solid #e2dfdc; border-radius: 10px">
<div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 700; color: #ffffff; background: #171512; padding: 1px 7px; border-radius: 4px">{{g.no}}</span>
<span style="font-size: 16px; font-weight: 700">{{g.label}}</span>
</div>
<p style="margin: 6px 0 0; font-size: 13px; color: #6d645a">{{g.desc}}</p>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px">
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
<button class="opt" type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 44px; text-align: left; background: #ffffff; border: {{o.border}}; border-radius: 8px; font: inherit; color: #171512; box-shadow: {{o.ring}}">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; box-sizing: border-box; padding: 6px; border-radius: 4px; background: #f6f5f4; font-size: 12px; color: #6d645a; text-align: center">
<sc-for list="{{o.marks}}" as="mk" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; justify-content: center; width: {{mk.w}}; height: {{mk.h}}; box-sizing: border-box; border-radius: {{mk.r}}; background: {{mk.bg}}; border: {{mk.bd}}; color: {{mk.fg}}; font-size: 11px; font-weight: 700; box-shadow: {{mk.sh}}">{{mk.t}}</span></sc-for>
<sc-for list="{{o.imgs}}" as="im" hint-placeholder-count="0"><img src="{{im}}" width="22" height="22" alt="" style="display: block"></sc-for>
<sc-if value="{{o.hasText}}" hint-placeholder-val="{{ false }}"><span style="white-space: pre-line; line-height: 1.4">{{o.text}}</span></sc-if>
</span>
<span style="font-size: 13px; font-weight: 700">{{o.name}}</span>
<span style="font-size: 12px; color: #6d645a; line-height: 1.4">{{o.note}}</span>
</button>
</sc-for>
</div>
</section>
</sc-for>
</div>
</sc-for>
</div>

<div style="flex: 1 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="font-size: 13px; font-weight: 700">預覽主題</span>
<sc-for list="{{themeBtns}}" as="tb" hint-placeholder-count="2">
<button type="button" onClick="{{tb.pick}}" aria-pressed="{{tb.pressed}}" style="min-height: 44px; padding: 0 14px; border: 1px solid {{tb.bd}}; background: {{tb.bg}}; color: {{tb.fg}}; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{tb.t}}</button>
</sc-for>
</div>

<div class="pv {{dkCls}}" style="background: {{c.page}}; color: {{c.ink}}; border: 1px solid #cfcac4; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px; font-size: 15px; line-height: 1.5">
<section style="display: flex; min-height: 380px; background: {{c.card}}; border-radius: 14px; box-shadow: {{c.shadow}}; overflow: hidden">
<nav aria-label="示範導覽" style="flex: 0 0 200px; padding: 14px 10px; border-right: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; margin-bottom: 8px; font-weight: 700"><span style="width: 22px; height: 22px; border-radius: 6px; background: #2457d6"></span>專案名稱</div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<button type="button" class="nv {{n.cls}}" onClick="{{n.pick}}" aria-current="{{n.cur}}" style="position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: {{n.fg}}; font: inherit; font-weight: {{n.fw}}; cursor: pointer; text-align: left">
<sc-if value="{{n.on}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: #2457d6"></span></sc-if>
<img src="{{n.src}}" width="{{navSize}}" height="{{navSize}}" alt="" style="display: block">{{n.t}}</button>
</sc-for>
</nav>
<div style="flex: 1 1 auto; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="font-size: 20px; font-weight: 700">{{pageTitle}}</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{tools}}" as="tl" hint-placeholder-count="5"><button type="button" class="tb" aria-label="{{tl.t}}" title="{{tl.t}}" style="width: 40px; height: 40px; border: 1px solid {{c.lineStrong}}; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><img src="{{tl.src}}" width="{{btnSize}}" height="{{btnSize}}" alt=""></button></sc-for>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #2457d6; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600"><img src="{{plusW}}" width="{{btnSize}}" height="{{btnSize}}" alt="">新增</button>
</div>
</div>
<div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 1 1 240px; border: 1px solid {{c.line}}; border-radius: 10px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 14px; background: {{r.bg}}; border-bottom: {{r.bd}}"><img src="{{folder}}" width="{{btnSize}}" height="{{btnSize}}" alt=""><span style="flex: 1 1 auto; font-weight: 600">{{r.t}}</span><span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px"><img src="{{more}}" width="{{btnSize}}" height="{{btnSize}}" alt=""></span></div></sc-for>
</div>
<div role="menu" aria-label="選單範例" style="flex: 0 0 200px; padding: 6px; border-radius: 10px; background: {{c.card}}; border: 1px solid {{c.line}}; box-shadow: {{c.overlay}}">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="4"><sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><div style="height: 1px; margin: 6px 4px; background: {{c.line}}"></div></sc-if><div role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; color: {{m.c}}; font-size: 14px"><img src="{{m.src}}" width="16" height="16" alt="">{{m.t}}</div></sc-for>
</div>
</div>
</div>
</section>

<section style="padding: 20px; background: {{c.card}}; border-radius: 14px; box-shadow: {{c.shadow}}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><div style="font-size: 18px; font-weight: 700">全部 24 個（{{setName}}）</div><div style="font-size: 13px; color: {{c.muted}}">{{license}}</div></div>
<div style="margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px">
<sc-for list="{{grid}}" as="g" hint-placeholder-count="24"><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border-radius: 10px; background: {{c.sub}}"><div style="display: flex; align-items: center; gap: 10px"><img src="{{g.src}}" width="24" height="24" alt=""><img src="{{g.src}}" width="16" height="16" alt=""></div><span style="font-size: 12px; color: {{c.muted}}">{{g.t}}</span></div></sc-for>
</div>
<div style="margin-top: 10px; font-size: 13px; color: {{c.muted}}">每格左邊是 24 px、右邊是 16 px，看小尺寸時是否還清楚。</div>
</section>
</div>
</div>
</div>

<section style="margin-top: 24px; padding: 14px 18px; border: 1px dashed #aca49a; border-radius: 8px; font-size: 13px; color: #6d645a">
<span style="color: #171512; font-weight: 700">目前設定</span>　{{summary}}
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2600}}'>
