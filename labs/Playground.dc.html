<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>風格調色盤</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Noto+Serif+TC:wght@600;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit;opacity:.8}
.btn{cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.ghost:hover{filter:none;opacity:.85}
.card:hover{transform:translateY(-3px)}
.s-brutal .btn:hover,.s-brutal .card:hover{transform:translate(-3px,-3px)}
.s-brutal .btn:active{transform:translate(3px,3px);box-shadow:none !important}
.btn:active{transform:scale(.97)}
.s-shadow .card:hover{box-shadow:0 2px 4px rgba(0,0,0,.08),0 16px 36px rgba(0,0,0,.14) !important}
.field:focus{outline:2px solid currentColor;outline-offset:2px}
.row:hover{opacity:.75}
.m1 .btn,.m2 .btn,.m3 .btn{transition:transform .15s ease,box-shadow .15s ease,filter .15s ease,opacity .15s ease}
.m1 .card,.m2 .card,.m3 .card{transition:transform .22s ease,box-shadow .22s ease}
.m1 .row,.m2 .row,.m3 .row{transition:opacity .15s ease}
@keyframes fadeA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fa{animation:fadeA .32s ease both}.fb{animation:fadeB .32s ease both}
@keyframes enter{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.li{animation:enter .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes riseA{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ra .rise{animation:riseA .7s cubic-bezier(.2,.8,.2,1) backwards}
.rb .rise{animation:riseB .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes float1{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(14px,-18px) rotate(10deg)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,12px)}}
.f1{animation:float1 6s ease-in-out infinite}.f2{animation:float2 7s ease-in-out infinite}.f3{animation:float1 9s ease-in-out infinite reverse}
</style>
</helmet>
<div class="{{rootCls}}" style="min-height: 100vh; background: {{t.bg}}; color: {{t.ink}}; font-family: {{fBody}}; font-size: 16px; line-height: 1.6; position: relative; overflow: hidden">

<div style="background: #f6f7f9; border-bottom: 1px solid #d5d9df; color: #111418; font-family: Inter, 'Noto Sans TC', sans-serif; font-size: 14px; line-height: 1.4">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center">
<span style="font-weight: 800; font-size: 15px">調整風格</span>
<sc-for list="{{ctrls}}" as="g" hint-placeholder-count="7">
<div role="group" aria-label="{{g.label}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: #47505b; margin-right: 4px">{{g.label}}</span>
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" aria-label="{{o.aria}}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
<sc-if value="{{o.isColor}}" hint-placeholder-val="{{ false }}"><span style="width: 16px; height: 16px; border-radius: 99px; background: {{o.dot}}; display: inline-block"></span></sc-if>
<sc-if value="{{o.hasText}}" hint-placeholder-val="{{ true }}"><span>{{o.text}}</span></sc-if>
</button>
</sc-for>
</div>
</sc-for>
<button type="button" onClick="{{resetAll}}" style="min-height: 44px; padding: 0 12px; border: 1px dashed #aab1ba; background: transparent; color: #47505b; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer">還原預設</button>
</div>
</div>

<header style="border-bottom: {{t.headerLine}}; background: {{t.bg}}">
<div style="max-width: 1200px; margin: 0 auto; padding: {{p.navPad}}; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px; font-family: {{fHead}}; font-weight: 700; font-size: 19px">
<span style="width: 24px; height: 24px; border-radius: {{rSm}}; background: {{accent}}; display: inline-block; border: {{b.mark}}"></span>
<span>[專案名稱]</span>
</div>
<nav style="display: flex; flex-wrap: wrap; gap: 24px; font-size: 15px; color: {{t.muted}}">
<a class="row" href="#" style="text-decoration: none; color: {{t.ink}}; font-weight: 600">首頁</a>
<a class="row" href="#" style="text-decoration: none; color: {{t.muted}}">功能</a>
<a class="row" href="#" style="text-decoration: none; color: {{t.muted}}">文件</a>
<a class="row" href="#" style="text-decoration: none; color: {{t.muted}}">關於</a>
</nav>
<div style="display: flex; gap: 10px">
<button class="btn ghost" type="button" style="min-height: 44px; padding: 0 16px; font: inherit; font-size: 15px; color: {{t.ink}}; background: {{b.ghostBg}}; border: {{b.ghostBorder}}; border-radius: {{rBtn}}; box-shadow: {{b.btnShadow}}">登入</button>
<button class="btn" type="button" style="min-height: 44px; padding: 0 18px; font: inherit; font-size: 15px; font-weight: 600; color: {{onAccent}}; background: {{accent}}; border: {{b.btnBorder}}; border-radius: {{rBtn}}; box-shadow: {{b.btnShadow}}">開始使用</button>
</div>
</div>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: {{p.main}}">

<section style="display: flex; flex-wrap: wrap; gap: {{p.gapL}}; align-items: center">
<div style="flex: 1 1 520px; min-width: 0">
<div class="rise" style="display: inline-block; padding: 4px 12px; font-size: 13px; font-weight: 600; color: {{accentText}}; background: {{accentSoft}}; border-radius: {{rPill}}; border: {{b.badge}}; animation-delay: 0ms">範例元件 · 用 Tweaks 切換</div>
<h1 class="rise" style="margin: 18px 0 0; font-family: {{fHead}}; font-size: 54px; line-height: 1.15; font-weight: {{headWeight}}; letter-spacing: {{headTrack}}; animation-delay: 90ms">找到你喜歡的<br>介面長相</h1>
<p class="rise" style="margin: 18px 0 0; font-size: 18px; color: {{t.muted}}; max-width: 520px; animation-delay: 180ms">同一組元件，換主題、強調色、圓角、字體、表面、密度和動畫程度。調到喜歡的組合後，把最下方的設定告訴我。</p>
<div class="rise" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; animation-delay: 270ms">
<button class="btn" type="button" onClick="{{showToast}}" style="min-height: 50px; padding: 0 24px; font: inherit; font-weight: 600; color: {{onAccent}}; background: {{accent}}; border: {{b.btnBorder}}; border-radius: {{rBtn}}; box-shadow: {{b.btnShadow}}">主要按鈕</button>
<button class="btn ghost" type="button" style="min-height: 50px; padding: 0 24px; font: inherit; color: {{t.ink}}; background: {{b.ghostBg}}; border: {{b.ghostBorder}}; border-radius: {{rBtn}}; box-shadow: {{b.btnShadow}}">次要按鈕</button>
<sc-if value="{{isM3}}" hint-placeholder-val="{{ false }}">
<button class="btn ghost" type="button" onClick="{{replay}}" style="min-height: 50px; padding: 0 18px; font: inherit; color: {{t.muted}}; background: transparent; border: 1px dashed {{t.line}}; border-radius: {{rBtn}}">重播進場</button>
</sc-if>
</div>
</div>
<div class="rise" style="flex: 1 1 380px; min-width: 0; position: relative; height: 300px; box-sizing: border-box; background: {{c.bg}}; border: {{c.border}}; border-radius: {{rLg}}; box-shadow: {{c.shadow}}; overflow: hidden; animation-delay: 360ms">
<div aria-hidden="true" class="{{float1}}" style="position: absolute; left: 44px; top: 40px; width: 110px; height: 110px; border-radius: {{rLg}}; background: {{accent}}; border: {{b.mark}}"></div>
<div aria-hidden="true" class="{{float2}}" style="position: absolute; right: 56px; top: 70px; width: 70px; height: 70px; border-radius: 999px; background: {{t.ink}}"></div>
<div aria-hidden="true" class="{{float3}}" style="position: absolute; left: 150px; bottom: 44px; width: 150px; height: 56px; border-radius: {{rSm}}; background: {{accentSoft}}; border: {{b.mark}}"></div>
<div aria-hidden="true" style="position: absolute; right: 36px; bottom: 36px; display: flex; align-items: flex-end; gap: 8px; height: 90px">
<span style="width: 14px; height: 40%; background: {{t.line}}; border-radius: {{rXs}}"></span>
<span style="width: 14px; height: 70%; background: {{t.line}}; border-radius: {{rXs}}"></span>
<span style="width: 14px; height: 55%; background: {{t.line}}; border-radius: {{rXs}}"></span>
<span style="width: 14px; height: 100%; background: {{accent}}; border-radius: {{rXs}}"></span>
</div>
</div>
</section>

<section style="margin-top: {{p.sec}}; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: {{p.gap}}">
<sc-for list="{{cards}}" as="k" hint-placeholder-count="3">
<a class="card rise" href="#" style="display: block; text-decoration: none; color: inherit; padding: {{p.card}}; background: {{c.bg}}; border: {{c.border}}; border-radius: {{rLg}}; box-shadow: {{c.shadow}}; animation-delay: {{k.d}}">
<div style="width: 40px; height: 40px; border-radius: {{rSm}}; background: {{accentSoft}}; display: flex; align-items: center; justify-content: center; border: {{b.badge}}">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{accentText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{k.icon}}"></path></svg>
</div>
<div style="margin-top: 14px; font-family: {{fHead}}; font-size: 20px; font-weight: 700">{{k.title}}</div>
<p style="margin: 6px 0 0; font-size: 15px; color: {{t.muted}}">{{k.body}}</p>
<div style="margin-top: 14px; font-size: 15px; font-weight: 600; color: {{accentText}}">了解更多 →</div>
</a>
</sc-for>
</section>

<section style="margin-top: {{p.gap}}; display: flex; flex-wrap: wrap; gap: {{p.gap}}">
<div class="rise" style="flex: 1 1 340px; min-width: 0; padding: {{p.card}}; background: {{c.bg}}; border: {{c.border}}; border-radius: {{rLg}}; box-shadow: {{c.shadow}}; animation-delay: 300ms">
<div style="font-family: {{fHead}}; font-size: 20px; font-weight: 700">表單</div>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: {{p.field}}">
<div>
<label for="pg-name" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px">名稱</label>
<input id="pg-name" class="field" type="text" placeholder="輸入名稱" style="box-sizing: border-box; width: 100%; min-height: 46px; padding: 0 14px; font: inherit; color: {{t.ink}}; background: {{t.input}}; border: {{b.input}}; border-radius: {{rSm}}">
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 15px">接收通知</span>
<button type="button" onClick="{{toggle}}" aria-label="切換通知" aria-pressed="{{onAttr}}" style="flex: 0 0 52px; width: 52px; height: 30px; padding: 3px; cursor: pointer; border: {{b.toggle}}; border-radius: {{rToggle}}; background: {{trackBg}}; box-sizing: border-box; transition: background {{dToggle}}">
<span style="display: block; width: 22px; height: 22px; border-radius: {{rKnob}}; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transform: {{knob}}; transition: transform {{dToggleSpring}}"></span>
</button>
</div>
<button type="button" onClick="{{check}}" aria-pressed="{{chkAttr}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; font: inherit; color: {{t.ink}}; cursor: pointer; text-align: left">
<span style="flex: 0 0 22px; width: 22px; height: 22px; box-sizing: border-box; border-radius: {{rXs}}; border: {{chkBorder}}; background: {{chkBg}}; display: flex; align-items: center; justify-content: center; transition: background {{dToggle}}">
<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{onAccent}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="transform: {{chkMark}}; transition: transform {{dToggleSpring}}"><path d="M4 12.5l5 5L20 6.5"></path></svg>
</span>
<span>我同意條款</span>
</button>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 4px 12px; font-size: 13px; font-weight: 600; border-radius: {{rPill}}; background: {{accentSoft}}; color: {{accentText}}; border: {{b.badge}}">標籤</span>
<span style="padding: 4px 12px; font-size: 13px; font-weight: 600; border-radius: {{rPill}}; background: {{t.sub}}; color: {{t.muted}}; border: {{b.badge}}">草稿</span>
<span style="padding: 4px 12px; font-size: 13px; font-weight: 600; border-radius: {{rPill}}; background: {{t.okBg}}; color: {{t.ok}}; border: {{b.badge}}">完成</span>
</div>
</div>
</div>

<div class="rise" style="flex: 2 1 480px; min-width: 0; padding: {{p.card}}; background: {{c.bg}}; border: {{c.border}}; border-radius: {{rLg}}; box-shadow: {{c.shadow}}; animation-delay: 380ms">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<div style="position: relative; display: flex; padding: 4px; background: {{t.sub}}; border-radius: {{rSeg}}; border: {{b.badge}}">
<span style="position: absolute; top: 4px; left: 4px; width: 96px; height: 38px; background: {{segBg}}; border-radius: {{rSegIn}}; box-shadow: {{segShadow}}; border: {{b.segIn}}; box-sizing: border-box; transform: {{segX}}; transition: transform {{dSeg}}"></span>
<sc-for list="{{tabs}}" as="g" hint-placeholder-count="3">
<button type="button" onClick="{{g.pick}}" style="position: relative; width: 96px; height: 38px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: {{g.color}}; cursor: pointer">{{g.label}}</button>
</sc-for>
</div>
<button class="btn ghost" type="button" onClick="{{add}}" style="min-height: 44px; padding: 0 16px; font: inherit; font-size: 14px; color: {{t.ink}}; background: {{b.ghostBg}}; border: {{b.ghostBorder}}; border-radius: {{rBtn}}; box-shadow: {{b.btnShadow}}">新增一列</button>
</div>
<div class="{{tabCls}}" style="margin-top: 14px; overflow-x: auto">
<div style="min-width: 440px">
<div style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: {{p.cell}}; font-size: 13px; font-weight: 600; color: {{t.muted}}; border-bottom: 1px solid {{t.line}}">
<span>{{tabHead}}</span><span>狀態</span><span>更新</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div class="row {{liCls}}" style="display: grid; grid-template-columns: 2fr 1fr 1fr; padding: {{p.cell}}; font-size: 15px; border-bottom: 1px solid {{t.line}}">
<span>{{r.name}}</span><span style="color: {{r.color}}">● {{r.status}}</span><span style="color: {{t.muted}}">[時間]</span>
</div>
</sc-for>
</div>
</div>
</div>
</section>

<section style="margin-top: {{p.sec}}; padding: 16px 20px; border: 1px dashed {{t.line}}; border-radius: {{rSm}}; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-size: 14px; color: {{t.muted}}">
<span style="color: {{t.ink}}; font-weight: 700">目前設定</span>　{{summary}}
</section>
</main>

<div role="status" style="position: absolute; right: 28px; bottom: 28px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: {{t.toastBg}}; color: {{t.toastInk}}; border-radius: {{rSm}}; border: {{b.toast}}; box-shadow: {{toastShadow}}; transform: {{toastPos}}; opacity: {{toastOp}}; transition: {{dToast}}; pointer-events: none">
<span style="width: 8px; height: 8px; border-radius: 99px; background: {{accent}}; display: inline-block"></span>
<span>已送出</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["淺色","深色","柔和灰"],"default":"淺色","section":"外觀"},"accent":{"editor":"color","options":["#2457d6","#0f766e","#5b4bdb","#c2410c"],"default":"#2457d6","section":"外觀"},"radius":{"editor":"enum","options":["直角","小圓角","中圓角","大圓角","膠囊"],"default":"中圓角","section":"外觀"},"font":{"editor":"enum","options":["無襯線","幾何","襯線標題","等寬"],"default":"無襯線","section":"外觀"},"surface":{"editor":"enum","options":["細線","柔和陰影","粗框硬陰影","填色無框"],"default":"細線","section":"外觀"},"density":{"editor":"enum","options":["緊密","標準","寬鬆"],"default":"標準","section":"版面"},"motion":{"editor":"enum","options":["無動畫","Level 1 細緻回饋","Level 2 轉場","Level 3 吸睛"],"default":"Level 2 轉場","section":"動畫"},"$preview":{"width":1440,"height":1440}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { o: {}, tab: 0, on: true, chk: false, toast: false, extra: 0, r: 0, tabN: 0 }; }
  componentWillUnmount() { clearTimeout(this.t1); }
  hex(h) { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((x) => x + x).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); }
  mix(h, w, a) { const x = this.hex(h), y = this.hex(w); return '#' + x.map((v, i) => Math.round(v * (1 - a) + y[i] * a).toString(16).padStart(2, '0')).join(''); }
  lum(h) { const c = this.hex(h).map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
  renderVals() {
    const P = this.props, s = this.state;
    const get = (k, d) => (s.o[k] ?? P[k] ?? d);
    const theme = get('theme', '淺色');
    const accent = get('accent', '#2457d6');
    const radius = get('radius', '中圓角');
    const font = get('font', '無襯線');
    const surface = get('surface', '細線');
    const density = get('density', '標準');
    const motion = get('motion', 'Level 2 轉場');
    const cur = { theme, accent, radius, font, surface, density, motion };
    const defs = [
      ['theme', '主題', ['淺色', '深色', '柔和灰']],
      ['accent', '強調色', ['#2457d6', '#0f766e', '#5b4bdb', '#c2410c']],
      ['radius', '圓角', ['直角', '小圓角', '中圓角', '大圓角', '膠囊']],
      ['font', '字體', ['無襯線', '幾何', '襯線標題', '等寬']],
      ['surface', '表面', ['細線', '柔和陰影', '粗框硬陰影', '填色無框']],
      ['density', '密度', ['緊密', '標準', '寬鬆']],
      ['motion', '動畫', ['無動畫', 'Level 1 細緻回饋', 'Level 2 轉場', 'Level 3 吸睛']]
    ];
    const short = { '無動畫': '無', 'Level 1 細緻回饋': 'L1 回饋', 'Level 2 轉場': 'L2 轉場', 'Level 3 吸睛': 'L3 吸睛' };
    const ctrls = defs.map(([k, label, opts]) => ({
      label,
      opts: opts.map((v) => {
        const on = String(cur[k]).toLowerCase() === v.toLowerCase();
        const isColor = k === 'accent';
        return {
          text: short[v] || v, hasText: !isColor, isColor, dot: v, aria: label + ' ' + v,
          pressed: on ? 'true' : 'false',
          bg: on ? '#111418' : '#ffffff', fg: on ? '#ffffff' : '#111418', bd: on ? '#111418' : '#d5d9df',
          pick: () => this.setState({ o: Object.assign({}, this.state.o, { [k]: v }), r: this.state.r + (k === 'motion' ? 1 : 0) })
        };
      })
    }));
    const m = ['無動畫', 'Level 1 細緻回饋', 'Level 2 轉場', 'Level 3 吸睛'].indexOf(motion);
    const lvl = m < 0 ? 2 : m;
    const dark = theme === '深色';
    const T = {
      '淺色': { bg: '#ffffff', ink: '#111418', muted: '#5b6470', line: '#e3e6ea', sub: '#f3f4f6', input: '#ffffff', okBg: '#e3f5ea', ok: '#17663d', toastBg: '#111418', toastInk: '#ffffff' },
      '深色': { bg: '#0d0f12', ink: '#eceef1', muted: '#9aa3ae', line: '#2a2f37', sub: '#1c2026', input: '#12151a', okBg: '#163323', ok: '#7ee2a8', toastBg: '#eceef1', toastInk: '#0d0f12' },
      '柔和灰': { bg: '#eef0f2', ink: '#1c1f24', muted: '#566070', line: '#d8dce1', sub: '#e3e6ea', input: '#ffffff', okBg: '#dcefe3', ok: '#17663d', toastBg: '#1c1f24', toastInk: '#ffffff' }
    }[theme] || {};
    const cardBg = theme === '柔和灰' ? '#ffffff' : (dark ? '#15181d' : '#ffffff');
    const brutal = surface === '粗框硬陰影';
    const R = { '直角': [0, 0, 0, 0], '小圓角': [4, 6, 8, 6], '中圓角': [6, 10, 14, 10], '大圓角': [8, 14, 24, 14], '膠囊': [8, 14, 28, 999] }[radius] || [6, 10, 14, 10];
    const px = (n) => n + 'px';
    const F = {
      '無襯線': ["Inter, 'Noto Sans TC', sans-serif", "Inter, 'Noto Sans TC', sans-serif", 800, '-.02em'],
      '幾何': ["'Space Grotesk', 'Noto Sans TC', sans-serif", "'Space Grotesk', 'Noto Sans TC', sans-serif", 700, '-.03em'],
      '襯線標題': ["Newsreader, 'Noto Serif TC', serif", "Inter, 'Noto Sans TC', sans-serif", 900, '0'],
      '等寬': ["'JetBrains Mono', 'Noto Sans TC', monospace", "'JetBrains Mono', 'Noto Sans TC', monospace", 700, '-.02em']
    }[font] || [];
    const D = { '緊密': .72, '標準': 1, '寬鬆': 1.35 }[density] || 1;
    const sp = (n) => Math.round(n * D) + 'px';
    const ink = T.ink;
    const onAccent = this.lum(accent) > .45 ? '#111418' : '#ffffff';
    const accentText = dark ? this.mix(accent, '#ffffff', .4) : accent;
    const accentSoft = dark ? this.mix(accent, '#0d0f12', .75) : this.mix(accent, '#ffffff', .88);
    let C, B;
    if (surface === '柔和陰影') {
      C = { bg: cardBg, border: '1px solid transparent', shadow: dark ? '0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45)' : '0 1px 2px rgba(16,24,40,.06), 0 10px 28px rgba(16,24,40,.09)' };
      B = { btnBorder: '0', btnShadow: dark ? 'none' : '0 1px 2px rgba(16,24,40,.12)', ghostBg: cardBg, ghostBorder: '1px solid ' + T.line, input: '1px solid ' + T.line, badge: '0', mark: '0', toggle: '0', segIn: '0', toast: '0' };
    } else if (brutal) {
      C = { bg: cardBg, border: '2.5px solid ' + ink, shadow: '6px 6px 0 ' + ink };
      B = { btnBorder: '2.5px solid ' + ink, btnShadow: '4px 4px 0 ' + ink, ghostBg: cardBg, ghostBorder: '2.5px solid ' + ink, input: '2.5px solid ' + ink, badge: '2px solid ' + ink, mark: '2.5px solid ' + ink, toggle: '2.5px solid ' + ink, segIn: '2px solid ' + ink, toast: '2.5px solid ' + ink };
    } else if (surface === '填色無框') {
      C = { bg: T.sub, border: '0', shadow: 'none' };
      B = { btnBorder: '0', btnShadow: 'none', ghostBg: T.sub, ghostBorder: '0', input: '1px solid transparent', badge: '0', mark: '0', toggle: '0', segIn: '0', toast: '0' };
    } else {
      C = { bg: cardBg, border: '1px solid ' + T.line, shadow: 'none' };
      B = { btnBorder: '0', btnShadow: 'none', ghostBg: 'transparent', ghostBorder: '1px solid ' + T.line, input: '1px solid ' + T.line, badge: '0', mark: '0', toggle: '0', segIn: '0', toast: '0' };
    }
    const inputBg = surface === '填色無框' ? (dark ? '#12151a' : '#ffffff') : T.input;
    const Tt = Object.assign({}, T, { input: inputBg, headerLine: brutal ? '2.5px solid ' + ink : '1px solid ' + T.line });
    const spring = 'cubic-bezier(.34,1.56,.64,1)', ease = 'cubic-bezier(.3,.7,.3,1)';
    const statuses = [['啟用', T.ok], ['等待中', dark ? '#f5c26b' : '#9a5b00'], ['停用', T.muted]];
    const tabNames = ['專案', '成員', '紀錄'];
    const baseRows = [0, 1, 2].map((i) => ({ name: '[' + tabNames[s.tab] + (i + 1) + ']', status: statuses[i][0], color: statuses[i][1] }));
    const extraRows = [];
    for (let i = 0; i < s.extra; i++) extraRows.push({ name: '[新項目 ' + (i + 1) + ']', status: '啟用', color: T.ok });
    const icons = ['M4 6h16M4 12h16M4 18h10', 'M12 3l8 4.5v9L12 21l-8-4.5v-9z', 'M5 12l4 4L19 6'];
    return {
      ctrls,
      resetAll: () => this.setState({ o: {} }),
      rootCls: 'pg m' + lvl + (brutal ? ' s-brutal' : '') + (surface === '柔和陰影' ? ' s-shadow' : '') + (lvl === 3 ? (s.r % 2 ? ' rb' : ' ra') : ''),
      t: Tt, c: C, b: B,
      fHead: F[0], fBody: F[1], headWeight: F[2], headTrack: F[3],
      accent, onAccent, accentText, accentSoft,
      rXs: px(R[0]), rSm: px(R[1]), rLg: px(R[2]), rBtn: px(R[3]), rPill: radius === '直角' ? '0' : '999px',
      rToggle: radius === '直角' ? '0' : '999px', rKnob: radius === '直角' ? '0' : '999px',
      rSeg: px(R[1]), rSegIn: px(Math.max(0, R[1] - 3)),
      p: { navPad: sp(18) + ' 32px', main: sp(64) + ' 32px ' + sp(64), gapL: sp(48), gap: sp(20), sec: sp(56), card: sp(24), field: sp(16), cell: sp(12) + ' ' + sp(8) },
      isM3: lvl === 3,
      replay: () => this.setState({ r: s.r + 1 }),
      float1: lvl === 3 ? 'f1' : '', float2: lvl === 3 ? 'f2' : '', float3: lvl === 3 ? 'f3' : '',
      cards: [
        { title: '清楚的層級', body: '標題、內文、輔助文字三層，靠大小與灰階區分。', icon: icons[0], d: '300ms' },
        { title: '一致的元件', body: '按鈕、卡片、輸入框共用同一組圓角與邊框規則。', icon: icons[1], d: '380ms' },
        { title: '適量的動畫', body: '只在回饋與轉場使用，不搶內容的注意力。', icon: icons[2], d: '460ms' }
      ],
      onAttr: s.on ? 'true' : 'false',
      toggle: () => this.setState({ on: !s.on }),
      trackBg: s.on ? accent : (dark ? '#3a3f47' : '#c9ced6'),
      knob: s.on ? 'translateX(22px)' : 'translateX(0)',
      dToggle: lvl === 0 ? '0s' : '.15s ease',
      dToggleSpring: lvl === 0 ? '0s' : (lvl === 1 ? '.15s ease' : '.3s ' + spring),
      chkAttr: s.chk ? 'true' : 'false',
      check: () => this.setState({ chk: !s.chk }),
      chkBorder: brutal ? '2.5px solid ' + ink : '1.5px solid ' + (s.chk ? accent : T.muted),
      chkBg: s.chk ? accent : 'transparent',
      chkMark: s.chk ? 'scale(1)' : 'scale(0)',
      tabs: tabNames.map((l, i) => ({ label: l, color: i === s.tab ? ink : T.muted, pick: () => this.setState({ tab: i, tabN: s.tabN + 1 }) })),
      segX: 'translateX(' + (s.tab * 96) + 'px)',
      segBg: dark ? '#2a2f37' : '#ffffff',
      segShadow: brutal || dark ? 'none' : '0 1px 3px rgba(0,0,0,.12)',
      dSeg: lvl >= 2 ? '.3s ' + ease : (lvl === 1 ? '.12s ease' : '0s'),
      tabCls: lvl >= 2 ? (s.tabN % 2 ? 'fa' : 'fb') : '',
      tabHead: tabNames[s.tab] + '名稱',
      rows: baseRows.concat(extraRows),
      liCls: lvl >= 2 ? 'li' : '',
      add: () => this.setState({ extra: Math.min(4, s.extra + 1) }),
      showToast: () => { clearTimeout(this.t1); this.setState({ toast: true }); this.t1 = setTimeout(() => this.setState({ toast: false }), 2200); },
      toastPos: s.toast ? 'translateY(0)' : 'translateY(20px)',
      toastOp: s.toast ? 1 : 0,
      toastShadow: brutal ? '4px 4px 0 ' + ink : '0 12px 32px rgba(0,0,0,.25)',
      dToast: lvl >= 2 ? 'transform .35s ' + spring + ', opacity .25s ease' : (lvl === 1 ? 'opacity .15s ease' : 'none'),
      summary: ['主題 ' + theme, '強調色 ' + accent, '圓角 ' + radius, '字體 ' + font, '表面 ' + surface, '密度 ' + density, '動畫 ' + motion].join(' · ')
    };
  }
}
</script>
