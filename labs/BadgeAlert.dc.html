<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Badge 與 Alert 新方向</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit;opacity:.8}
.dir{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background-color .3s ease}
.dir:hover{transform:translateY(-2px)}
</style>
</helmet>
<div style="min-height: 100vh; background: {{c.page}}; color: {{c.ink}}; font-family: Inter, 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.55; transition: background-color .35s ease, color .35s ease">
<main style="max-width: 1360px; margin: 0 auto; padding: 40px 32px 56px">
<div style="font-family: 'Geist Mono', 'Noto Sans TC', monospace; font-size: 13px; font-weight: 600; color: {{c.muted}}">深入 5 · 元件細節</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between">
<h1 style="margin: 6px 0 0; font-size: 39px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em">Badge 與 Alert 新方向</h1>
<span style="display: flex; gap: 8px">
<sc-for list="{{themeBtns}}" as="tb" hint-placeholder-count="2">
<button type="button" onClick="{{tb.pick}}" aria-pressed="{{tb.pressed}}" style="min-height: 44px; padding: 0 14px; border: 1px solid {{tb.bd}}; background: {{tb.bg}}; color: {{tb.fg}}; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{tb.t}}</button>
</sc-for>
</span>
</div>
<p style="margin: 8px 0 0; color: {{c.muted}}; max-width: 900px">形狀與外框完全重做。後半段的方向參考了 Atlassian、GitHub Primer、Shopify Polaris、IBM Carbon 與你 Figma 裡的 Material 3 Design Kit，卡片說明裡註明了來源。點一張卡片選擇方向，可以切換深色主題確認兩套都好看。選好後把最下方的設定給我，再進一步調細節。</p>

<h2 style="margin: 36px 0 0; font-size: 25px; line-height: 1.3; font-weight: 700">Badge</h2>
<div style="margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px">
<sc-for list="{{badgeDirs}}" as="d" hint-placeholder-count="7">
<button class="dir" type="button" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; text-align: left; background: {{c.card}}; border: 0; border-radius: 14px; box-shadow: {{d.ring}}; font: inherit; color: {{c.ink}}">
<span style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 700; color: {{c.muted}}">{{d.no}}</span>
<span style="font-size: 18px; font-weight: 700">{{d.name}}</span>
<span style="font-size: 12px; font-weight: 600; color: {{c.muted}}">存在感 {{d.level}}</span>
</span>
<span style="font-size: 13px; color: {{c.muted}}">{{d.note}}</span>
<span style="display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center">
<sc-for list="{{d.items}}" as="b" hint-placeholder-count="5">
<span style="display: inline-flex; align-items: center; gap: 6px; height: {{b.h}}; padding: {{b.p}}; border-radius: {{b.r}}; background: {{b.bg}}; color: {{b.fg}}; border: {{b.bd}}; border-bottom: {{b.bb}}; font-family: {{b.ff}}; font-size: {{b.fs}}; font-weight: {{b.fw}}; letter-spacing: {{b.ls}}; clip-path: {{b.clip}}; box-shadow: {{b.bsh}}; white-space: nowrap; box-sizing: border-box; overflow: {{b.ovf}}">
<sc-if value="{{b.anchor}}" hint-placeholder-val="{{ false }}"><span style="position: relative; display: inline-flex; width: 24px; height: 24px; margin-right: 4px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{b.ic}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.path}}"></path></svg><span style="position: absolute; top: {{b.at}}; left: {{b.al}}; min-width: {{b.aw}}; height: {{b.ah}}; padding: {{b.ap}}; box-sizing: border-box; border-radius: 99px; background: {{b.dc}}; color: #ffffff; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 700; line-height: {{b.ah}}; text-align: center; box-shadow: 0 0 0 2px {{b.ring}}">{{b.an}}</span></span></sc-if>
<sc-if value="{{b.split}}" hint-placeholder-val="{{ false }}"><span style="align-self: stretch; display: inline-flex; align-items: center; margin: 0 2px 0 -8px; padding: 0 8px; background: {{b.sbg}}; color: {{b.sfg}}; font-weight: 600">{{b.st}}</span></sc-if>
<sc-if value="{{b.dot}}" hint-placeholder-val="{{ false }}"><span style="width: 8px; height: 8px; border-radius: 99px; background: {{b.dc}}; box-shadow: {{b.halo}}"></span></sc-if>
<sc-if value="{{b.icon}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{b.ic}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.path}}"></path></svg></sc-if>
<sc-if value="{{b.glyph}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="{{b.dc}}" stroke-width="2.5"></circle><path d="{{b.gpath}}" fill="{{b.dc}}"></path></svg></sc-if>
{{b.t}}<sc-if value="{{b.count}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 99px; background: {{b.cbg}}; color: {{b.cfg}}; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 700">{{b.cn}}</span></sc-if></span>
</sc-for>
</span>
<span style="display: block; padding: 12px 14px; border-radius: 10px; background: {{c.sub}}; font-size: 14px">
<span style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><span style="font-weight: 600">叢集監控</span><sc-for list="{{d.rowItems}}" as="b" hint-placeholder-count="1">
<span style="display: inline-flex; align-items: center; gap: 6px; height: {{b.h}}; padding: {{b.p}}; border-radius: {{b.r}}; background: {{b.bg}}; color: {{b.fg}}; border: {{b.bd}}; border-bottom: {{b.bb}}; font-family: {{b.ff}}; font-size: {{b.fs}}; font-weight: {{b.fw}}; letter-spacing: {{b.ls}}; clip-path: {{b.clip}}; box-shadow: {{b.bsh}}; white-space: nowrap; box-sizing: border-box; overflow: {{b.ovf}}">
<sc-if value="{{b.anchor}}" hint-placeholder-val="{{ false }}"><span style="position: relative; display: inline-flex; width: 24px; height: 24px; margin-right: 4px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{b.ic}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.path}}"></path></svg><span style="position: absolute; top: {{b.at}}; left: {{b.al}}; min-width: {{b.aw}}; height: {{b.ah}}; padding: {{b.ap}}; box-sizing: border-box; border-radius: 99px; background: {{b.dc}}; color: #ffffff; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 700; line-height: {{b.ah}}; text-align: center; box-shadow: 0 0 0 2px {{b.ring}}">{{b.an}}</span></span></sc-if>
<sc-if value="{{b.split}}" hint-placeholder-val="{{ false }}"><span style="align-self: stretch; display: inline-flex; align-items: center; margin: 0 2px 0 -8px; padding: 0 8px; background: {{b.sbg}}; color: {{b.sfg}}; font-weight: 600">{{b.st}}</span></sc-if>
<sc-if value="{{b.dot}}" hint-placeholder-val="{{ false }}"><span style="width: 8px; height: 8px; border-radius: 99px; background: {{b.dc}}; box-shadow: {{b.halo}}"></span></sc-if>
<sc-if value="{{b.icon}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{b.ic}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.path}}"></path></svg></sc-if>
<sc-if value="{{b.glyph}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="{{b.dc}}" stroke-width="2.5"></circle><path d="{{b.gpath}}" fill="{{b.dc}}"></path></svg></sc-if>
{{b.t}}<sc-if value="{{b.count}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 99px; background: {{b.cbg}}; color: {{b.cfg}}; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 700">{{b.cn}}</span></sc-if></span>
</sc-for></span>
</span>
</button>
</sc-for>
</div>

<h2 style="margin: 40px 0 0; font-size: 25px; line-height: 1.3; font-weight: 700">Alert</h2>
<div style="margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 16px">
<sc-for list="{{alertDirs}}" as="d" hint-placeholder-count="6">
<button class="dir" type="button" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; text-align: left; background: {{c.card}}; border: 0; border-radius: 14px; box-shadow: {{d.ring}}; font: inherit; color: {{c.ink}}">
<span style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 700; color: {{c.muted}}">{{d.no}}</span>
<span style="font-size: 18px; font-weight: 700">{{d.name}}</span>
<span style="font-size: 12px; font-weight: 600; color: {{c.muted}}">存在感 {{d.level}}</span>
</span>
<span style="font-size: 13px; color: {{c.muted}}">{{d.note}}</span>
<span style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 10px; background: {{c.page}}">
<sc-for list="{{d.items}}" as="a" hint-placeholder-count="2">
<span style="position: relative; display: flex; align-items: {{a.align}}; gap: 12px; padding: {{a.pad}}; border-radius: {{a.r}}; background: {{a.bg}}; color: {{a.fg}}; border: {{a.bd}}; border-bottom: {{a.bb}}; box-shadow: {{a.sh}}; overflow: {{a.ovf}}; font-size: 14px; line-height: 1.5; align-self: {{a.self}}">
<sc-if value="{{a.headerBar}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; top: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: {{a.strong}}; color: {{a.hfg}}; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.path}}"></path></svg>{{a.title}}</span></sc-if>
<sc-if value="{{a.topBar}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; top: 0; height: 3px; background: {{a.strong}}"></span></sc-if>
<sc-if value="{{a.block}}" hint-placeholder-val="{{ false }}"><span style="flex: 0 0 44px; align-self: stretch; display: flex; align-items: center; justify-content: center; background: {{a.strong}}; color: #ffffff; margin: -12px 0 -12px -14px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.path}}"></path></svg></span></sc-if>
<sc-if value="{{a.circle}}" hint-placeholder-val="{{ false }}"><span style="flex: 0 0 32px; width: 32px; height: 32px; border-radius: 99px; background: {{a.soft}}; color: {{a.iconColor}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.path}}"></path></svg></span></sc-if>
<sc-if value="{{a.plainIcon}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{a.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 18px; margin-top: {{a.iconTop}}"><path d="{{a.path}}"></path></svg></sc-if>
<sc-if value="{{a.dot}}" hint-placeholder-val="{{ false }}"><span style="flex: 0 0 8px; width: 8px; height: 8px; border-radius: 99px; background: {{a.dotColor}}"></span></sc-if>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; flex-direction: {{a.textDir}}; gap: {{a.textGap}}; flex-wrap: wrap"><sc-if value="{{a.showTitle}}" hint-placeholder-val="{{ true }}"><span style="font-weight: 700; color: {{a.titleColor}}; text-decoration: {{a.titleDeco}}; text-underline-offset: 3px">{{a.title}}</span></sc-if><sc-if value="{{a.showBody}}" hint-placeholder-val="{{ true }}"><span style="color: {{a.bodyColor}}">{{a.body}}</span></sc-if></span>
<sc-if value="{{a.links}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 16px; font-weight: 700; color: {{a.linkColor}}"><span>{{a.actText}}</span><span>了解原因</span></span></sc-if>
<sc-if value="{{a.bubble}}" hint-placeholder-val="{{ false }}"><span style="position: relative; display: block; margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: {{a.bubbleBg}}; color: {{a.bubbleFg}}; box-shadow: {{a.bubbleSh}}; font-size: 13px">{{a.body}}<span style="position: absolute; left: 14px; top: -5px; width: 10px; height: 10px; background: {{a.bubbleBg}}; transform: rotate(45deg)"></span></span></sc-if>
</span>
<sc-if value="{{a.action2}}" hint-placeholder-val="{{ false }}"><span style="flex: 0 0 auto; display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid {{a.lineStrong}}; color: {{a.ink}}; font-weight: 700; font-size: 13px">稍後</span></sc-if>
<sc-if value="{{a.action}}" hint-placeholder-val="{{ false }}"><span style="flex: 0 0 auto; display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: {{a.actBd}}; background: {{a.actBg}}; color: {{a.actFg}}; font-weight: 700; font-size: 13px">{{a.actText}}</span></sc-if>
<sc-if value="{{a.closeX}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{a.titleColor}}" stroke-width="2" stroke-linecap="round" style="flex: 0 0 18px"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
</span>
</sc-for>
</span>
</button>
</sc-for>
</div>

<section style="margin-top: 28px; padding: 14px 18px; border: 1px dashed {{c.lineStrong}}; border-radius: 8px; font-size: 13px; color: {{c.muted}}">
<span style="color: {{c.ink}}; font-weight: 700">目前設定</span>　{{summary}}
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5400}}'>

      neutral: { g: '', bold: false, n: 7, t: '草稿', strong: '#8c8073', text: '#6d645a', soft: '#f6f5f4', icon: 'M5 19h14M7 15l8-8 3 3-8 8H7z' }
