<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>浮層實驗室</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.opt{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.opt:hover{transform:translateY(-2px)}
.pv,.pv section{transition:background-color .2s ease,color .2s ease}
.ib:hover{background:#f6f5f4 !important}
.dk .ib:hover{background:#443f3b !important}
.ib:focus-visible,.mi:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(36,87,214,.35)}
.mi:hover{background:#f6f5f4 !important}
.dk .mi:hover{background:#443f3b !important}
@keyframes tFade{from{opacity:0}to{opacity:1}}
@keyframes tUpTop{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes tUpBottom{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes tUpLeft{from{opacity:0;transform:translateY(-50%) translateX(6px)}to{opacity:1;transform:translateY(-50%)}}
@keyframes tScTop{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes tScBottom{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes tScLeft{from{opacity:0;transform:translateY(-50%) scale(.7)}to{opacity:1;transform:translateY(-50%) scale(1)}}
.t-fade{animation:tFade .18s ease both}
.t-up-top{animation:tUpTop .22s cubic-bezier(.2,.8,.2,1) both}.t-up-bottom{animation:tUpBottom .22s cubic-bezier(.2,.8,.2,1) both}.t-up-left{animation:tUpLeft .22s cubic-bezier(.2,.8,.2,1) both}
.t-scale-top{transform-origin:50% 100%;animation:tScTop .22s cubic-bezier(.34,1.4,.64,1) both}.t-scale-bottom{transform-origin:50% 0;animation:tScBottom .22s cubic-bezier(.34,1.4,.64,1) both}.t-scale-left{transform-origin:100% 50%;animation:tScLeft .22s cubic-bezier(.34,1.4,.64,1) both}
@keyframes mDown{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mScale{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.m-down{transform-origin:top;animation:mDown .2s cubic-bezier(.2,.8,.2,1) both}.m-fade{animation:mFade .15s ease both}.m-scale{animation:mScale .18s cubic-bezier(.2,.8,.2,1) both}
@keyframes bdIn{from{opacity:0}to{opacity:1}}
.bd-in{animation:bdIn .25s ease both}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.dlg-in{animation:dlgIn .22s cubic-bezier(.2,.9,.3,1.1) both}
@media (prefers-reduced-motion: reduce){[class*="t-up-"],[class*="t-scale-"],.m-down,.m-scale{animation:tFade .15s ease both}}
</style>
</helmet>
<div style="min-height: 100vh; background: #f6f5f4; color: #171512; font-family: Inter, 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.55">
<main style="max-width: 1400px; margin: 0 auto; padding: 40px 32px 56px">
<div style="font-family: 'Geist Mono', 'Noto Sans TC', monospace; font-size: 13px; font-weight: 600; color: #6d645a">深入 10 · 浮層</div>
<h1 style="margin: 6px 0 0; font-size: 39px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em">浮層實驗室</h1>
<p style="margin: 8px 0 0; color: #6d645a; max-width: 900px">提示、「⋯」選單、彈出框、側邊抽屜。右邊的預覽：滑過右上角的圖示按鈕看提示、點「篩選」開彈出框、點列尾的「⋯」開選單、選「編輯」開抽屜。選好後把最下方的設定給我。</p>

<div style="margin-top: 28px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 18px; font-weight: 700; padding-top: 6px">{{sec.title}}</div>
<sc-for list="{{sec.groups}}" as="g" hint-placeholder-count="2">
<section style="padding: 16px; background: #ffffff; border: 1px solid #e2dfdc; border-radius: 10px">
<div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 700; color: #ffffff; background: #171512; padding: 1px 7px; border-radius: 4px">{{g.no}}</span>
<span style="font-size: 16px; font-weight: 700">{{g.label}}</span>
</div>
<p style="margin: 6px 0 0; font-size: 13px; color: #6d645a">{{g.desc}}</p>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px">
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
<button class="opt" type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 44px; text-align: left; background: #ffffff; border: {{o.border}}; border-radius: 8px; font: inherit; color: #171512; box-shadow: {{o.ring}}">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; box-sizing: border-box; padding: 6px; border-radius: 4px; background: #f6f5f4; font-size: 12px; color: #6d645a; text-align: center">
<sc-for list="{{o.marks}}" as="mk" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; justify-content: center; width: {{mk.w}}; height: {{mk.h}}; box-sizing: border-box; border-radius: {{mk.r}}; background: {{mk.bg}}; border: {{mk.bd}}; color: {{mk.fg}}; font-size: 11px; font-weight: 700; box-shadow: {{mk.sh}}">{{mk.t}}</span></sc-for>
<sc-if value="{{o.hasText}}" hint-placeholder-val="{{ false }}"><span style="white-space: pre-line; line-height: 1.4">{{o.text}}</span></sc-if>
</span>
<span style="font-size: 13px; font-weight: 700">{{o.name}}</span>
<span style="font-size: 12px; color: #6d645a; line-height: 1.4">{{o.note}}</span>
</button>
</sc-for>
</div>
</section>
</sc-for>
</div>
</sc-for>
</div>

<div style="flex: 1 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="font-size: 13px; font-weight: 700">預覽主題</span>
<sc-for list="{{themeBtns}}" as="tb" hint-placeholder-count="2">
<button type="button" onClick="{{tb.pick}}" aria-pressed="{{tb.pressed}}" style="min-height: 44px; padding: 0 14px; border: 1px solid {{tb.bd}}; background: {{tb.bg}}; color: {{tb.fg}}; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{tb.t}}</button>
</sc-for>
</div>

<div class="pv {{dkCls}}" style="position: relative; overflow: hidden; background: {{c.page}}; color: {{c.ink}}; border: 1px solid #cfcac4; border-radius: 12px; padding: 24px; min-height: 640px; font-size: 15px; line-height: 1.5" onClick="{{closeAll}}">
<section style="padding: 20px; background: {{c.card}}; border-radius: 14px; box-shadow: {{c.shadow}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="font-size: 20px; font-weight: 700">專案</div>
<div style="display: flex; gap: 6px; align-items: center">
<div style="position: relative" onClick="{{stop}}">
<button type="button" onClick="{{togglePop}}" aria-expanded="{{popAria}}" aria-haspopup="dialog" onMouseEnter="{{popHoverIn}}" onMouseLeave="{{popHoverOut}}" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid {{c.lineStrong}}; border-radius: 10px; background: {{popBtnBg}}; color: {{c.ink}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"></path></svg>篩選<sc-if value="{{fCount}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 99px; background: #2457d6; color: #ffffff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">{{fN}}</span></sc-if></button>
<sc-if value="{{popOpen}}" hint-placeholder-val="{{ false }}">
<div class="m-fade" role="dialog" aria-label="篩選" onMouseEnter="{{popHoverIn}}" onMouseLeave="{{popHoverOut}}" style="position: absolute; z-index: 20; top: calc(100% + {{popGap}}); right: 0; width: 260px; padding: 16px; border-radius: 14px; background: {{c.card}}; border: 1px solid {{c.line}}; box-shadow: {{c.overlay}}">
<sc-if value="{{popArrow}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: -7px; right: 28px; width: 12px; height: 12px; background: {{c.card}}; border-left: 1px solid {{c.line}}; border-top: 1px solid {{c.line}}; transform: rotate(45deg)"></span></sc-if>
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 700">篩選狀態</span><sc-if value="{{popX}}" hint-placeholder-val="{{ false }}"><button type="button" class="ib" onClick="{{closePop}}" aria-label="關閉" style="width: 32px; height: 32px; margin: -6px -8px 0 0; border: 0; border-radius: 6px; background: transparent; color: {{c.muted}}; cursor: pointer; font-size: 16px">×</button></sc-if></div>
<div style="margin-top: 8px; display: flex; flex-direction: column">
<sc-for list="{{fItems}}" as="fi" hint-placeholder-count="4"><button type="button" role="checkbox" aria-checked="{{fi.aria}}" onClick="{{fi.toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0; border: 0; background: transparent; color: {{c.ink}}; font: inherit; cursor: pointer; text-align: left"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 6px; border: 2px solid {{fi.bd}}; background: {{fi.bg}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{fi.mark}}</span>{{fi.t}}</button></sc-for>
</div>
<div style="margin-top: 10px; display: flex; justify-content: flex-end; gap: 8px"><button type="button" onClick="{{clearF}}" style="height: 36px; padding: 0 12px; border: 1px solid {{c.lineStrong}}; border-radius: 10px; background: transparent; color: {{c.ink}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">清除</button><button type="button" onClick="{{closePop}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: #2457d6; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">套用</button></div>
</div>
</sc-if>
</div>
<sc-for list="{{tools}}" as="tl" hint-placeholder-count="3">
<div style="position: relative" onMouseEnter="{{tl.enter}}" onMouseLeave="{{tl.leave}}">
<button type="button" class="ib" aria-label="{{tl.t}}" onFocus="{{tl.focus}}" onBlur="{{tl.leave}}" style="width: 40px; height: 40px; border: 1px solid {{c.lineStrong}}; border-radius: 10px; background: transparent; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{tl.icon}}"></path></svg></button>
<sc-if value="{{tl.show}}" hint-placeholder-val="{{ false }}"><span role="tooltip" class="{{tipCls}}" style="position: absolute; z-index: 30; {{tipPos}}; transform: {{tipT1}}; padding: 6px 10px; border-radius: 8px; background: {{tipBg}}; color: {{tipFg}}; border: {{tipBd}}; box-shadow: {{tipSh}}; font-size: 13px; font-weight: 600; white-space: nowrap; pointer-events: none">{{tl.t}}<sc-if value="{{tipArrow}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; {{arrowPos}}; width: 8px; height: 8px; background: {{tipBg}}; border: {{tipBd}}; {{arrowClip}}; transform: rotate(45deg)"></span></sc-if></span></sc-if>
</div>
</sc-for>
</div>
</div>

<div style="margin-top: 16px; border: 1px solid {{c.line}}; border-radius: 10px; overflow: visible">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px 0 16px; background: {{r.bg}}; border-bottom: {{r.bd}}; border-radius: {{r.rad}}">
<span style="flex: 1 1 auto; font-weight: 600">{{r.name}}</span>
<span style="flex: 0 0 90px; color: {{c.muted}}">{{r.owner}}</span>
<span style="flex: 0 0 64px; text-align: right; font-family: 'Geist Mono', monospace">{{r.prog}}</span>
<div style="position: relative" onClick="{{stop}}">
<button type="button" class="ib" onClick="{{r.toggle}}" aria-label="{{r.moreLabel}}" aria-haspopup="menu" aria-expanded="{{r.aria}}" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: {{r.moreBg}}; color: {{c.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
<sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
<div class="{{menuCls}}" role="menu" style="position: absolute; z-index: 25; top: calc(100% + 4px); {{menuSide}}; min-width: {{menuW}}; padding: 6px; border-radius: 10px; background: {{c.card}}; border: 1px solid {{c.line}}; box-shadow: {{c.overlay}}; transform-origin: {{menuOrigin}}">
<sc-for list="{{r.items}}" as="mi" hint-placeholder-count="4">
<sc-if value="{{mi.sep}}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 6px 4px; background: {{c.line}}"></div></sc-if>
<button type="button" role="menuitem" class="mi" onClick="{{mi.go}}" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{mi.c}}; font: inherit; font-size: 14px; cursor: pointer; text-align: left; white-space: nowrap"><sc-if value="{{menuIcons}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{mi.icon}}"></path></svg></sc-if><span style="flex: 1 1 auto">{{mi.t}}</span><sc-if value="{{menuKeys}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{c.muted}}">{{mi.k}}</span></sc-if></button>
</sc-for>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>
<div style="margin-top: 10px; min-height: 20px; font-size: 13px; color: {{c.muted}}">{{note}}</div>
</section>

<sc-if value="{{drawerMounted}}" hint-placeholder-val="{{ false }}">
<div onClick="{{stop}}" style="position: absolute; inset: 0; z-index: 40">
<div onClick="{{tryClose}}" style="position: absolute; inset: 0; background: {{bdBg}}; backdrop-filter: {{bdBlur}}; -webkit-backdrop-filter: {{bdBlur}}; opacity: {{bdOp}}; transition: opacity {{drDur}} ease"></div>
<aside role="dialog" aria-modal="true" aria-label="編輯專案" style="position: absolute; top: 0; right: 0; bottom: 0; width: {{drW}}; max-width: 100%; display: flex; flex-direction: column; background: {{c.card}}; box-shadow: {{drSh}}; transform: {{drTf}}; transition: transform {{drDur}} {{drEase}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid {{c.line}}">
<div style="font-size: 20px; font-weight: 700">編輯專案</div>
<div style="display: flex; align-items: center; gap: 8px">
<sc-if value="{{btnTop}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{save}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: #2457d6; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">儲存</button></sc-if>
<button type="button" class="ib" onClick="{{tryClose}}" aria-label="關閉" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: {{c.muted}}; cursor: pointer; font-size: 18px">×</button>
</div>
</div>
<div style="flex: 1 1 auto; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600">名稱 <span style="color: #c4322b">*</span></span><input value="{{fName}}" onChange="{{setName}}" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid {{c.lineStrong}}; border-radius: 10px; background: {{c.input}}; color: {{c.ink}}; font: inherit; font-size: 15px; outline: none"></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600">備註</span><textarea rows="4" onChange="{{setNote}}" value="{{fNote}}" style="padding: 10px 12px; box-sizing: border-box; border: 1px solid {{c.lineStrong}}; border-radius: 10px; background: {{c.input}}; color: {{c.ink}}; font: inherit; font-size: 15px; resize: none; outline: none"></textarea></label>
<div style="font-size: 13px; color: {{c.muted}}">改一下名稱或備註再關閉，看未儲存時的處理。</div>
</div>
<sc-if value="{{btnBottom}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid {{c.line}}">
<button type="button" onClick="{{tryClose}}" style="height: 40px; padding: 0 16px; border: 1px solid {{c.lineStrong}}; border-radius: 10px; background: transparent; color: {{c.ink}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">取消</button>
<button type="button" onClick="{{save}}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #2457d6; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">儲存</button>
</div>
</sc-if>
</aside>
<sc-if value="{{confirmOpen}}" hint-placeholder-val="{{ false }}">
<div class="bd-in" style="position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.2)">
<div class="dlg-in" role="alertdialog" aria-label="放棄變更" style="width: 340px; max-width: calc(100% - 32px); padding: 20px; border-radius: 14px; background: {{c.card}}; box-shadow: {{c.overlay}}">
<div style="font-size: 18px; font-weight: 700">放棄未儲存的變更？</div>
<div style="margin-top: 6px; font-size: 14px; color: {{c.muted}}">關閉後，剛才的修改不會保留。</div>
<div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px">
<button type="button" onClick="{{keepEditing}}" style="height: 40px; padding: 0 16px; border: 1px solid {{c.lineStrong}}; border-radius: 10px; background: transparent; color: {{c.ink}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">繼續編輯</button>
<button type="button" onClick="{{discard}}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #c4322b; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">放棄</button>
</div>
</div>
</div>
</sc-if>
</div>
</sc-if>
</div>
</div>
</div>

<section style="margin-top: 24px; padding: 14px 18px; border: 1px dashed #aca49a; border-radius: 8px; font-size: 13px; color: #6d645a">
<span style="color: #171512; font-weight: 700">目前設定</span>　{{summary}}
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3400}}'>
const ROWS = [['叢集監控', '王小明', '64%'], ['帳號整合', '李小華', '88%'], ['資料備份', '陳大同', '100%'], ['成本報表', '林美玲', '40%']];
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { tPos: 'top', tDelay: 0, tStyle: 'dark', tArrow: 'yes', tAnim: 'scale', mAlign: 'right', mItems: 'keys', mDanger: 'sep', mAnim: 'scale', pTrig: 'hover', pClose: 'outside', pArrow: 'yes', dW: 400, dBd: 'blur', dAnim: 'spring', dBtn: 'bottom', dDirty: 'confirm',
      dark: false, tip: -1, menu: -1, pop: false, f: { doing: true, review: false, done: false, draft: false }, drawer: false, drIn: false, confirm: false, dirty: false, name: '', noteV: '', note: '' };
  }
  componentDidMount() {
    this.onKey = (e) => {
      if (e.key !== 'Escape') return;
      const s = this.state;
      if (s.confirm) this.setState({ confirm: false });
      else if (s.drawer) { if (s.dirty && s.dDirty === 'confirm') this.setState({ confirm: true }); else this.closeDrawer(''); }
      else if (s.menu >= 0 || s.pop) this.setState({ menu: -1, pop: false });
    };
    document.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { clearTimeout(this.tT); clearTimeout(this.dT); clearTimeout(this.pT); document.removeEventListener('keydown', this.onKey); }
  openDrawer(name) {
    clearTimeout(this.dT);
    this.setState({ drawer: true, drIn: false, menu: -1, confirm: false, dirty: false, name, noteV: '', note: '' });
    this.dT = setTimeout(() => this.setState({ drIn: true }), 30);
  }
  closeDrawer(msg) {
    clearTimeout(this.dT);
    this.setState({ drIn: false, confirm: false, note: msg || '' });
    this.dT = setTimeout(() => this.setState({ drawer: false }), 420);
  }
  renderVals() {
