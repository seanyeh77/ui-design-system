<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>D 活潑粗框</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&amp;family=Noto+Sans+TC:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
.press{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.press:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 #111111}
.press:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #111111}
@keyframes wob{0%,100%{transform:rotate(-6deg)}25%{transform:rotate(6deg) scale(1.08)}50%{transform:rotate(-4deg)}75%{transform:rotate(3deg)}}
.sticker{transform:rotate(-6deg);cursor:default}
.sticker:hover{animation:wob .6s ease}
@keyframes popA{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes popB{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.pa{animation:popA .45s cubic-bezier(.3,1.6,.5,1)}
.pb{animation:popB .45s cubic-bezier(.3,1.6,.5,1)}
.stackcard{transition:transform .55s cubic-bezier(.34,1.56,.64,1),z-index 0s .2s}
.chk{cursor:pointer;transition:background .15s ease}
.mark{transition:transform .35s cubic-bezier(.34,1.8,.64,1)}
</style>
</helmet>
<div style="min-height: 100vh; background: #fffaf0; color: #111111; font-family: 'Bricolage Grotesque', 'Noto Sans TC', sans-serif; font-size: 17px; line-height: 1.5; overflow: hidden">
<header style="max-width: 1120px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<div style="font-weight: 800; font-size: 22px">[專案名稱]</div>
<nav style="display: flex; flex-wrap: wrap; gap: 10px">
<a class="press" href="#" style="padding: 8px 16px; border: 3px solid #111111; border-radius: 999px; background: #ffffff; text-decoration: none; font-weight: 700; box-shadow: 4px 4px 0 #111111">功能</a>
<a class="press" href="#" style="padding: 8px 16px; border: 3px solid #111111; border-radius: 999px; background: #ffffff; text-decoration: none; font-weight: 700; box-shadow: 4px 4px 0 #111111">社群</a>
<a class="press" href="#" style="padding: 8px 16px; border: 3px solid #111111; border-radius: 999px; background: #ffd84d; text-decoration: none; font-weight: 700; box-shadow: 4px 4px 0 #111111">加入</a>
</nav>
</header>

<main style="max-width: 1120px; margin: 0 auto; padding: 32px 32px 64px">
<section style="display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div style="flex: 1 1 460px; min-width: 0">
<span class="sticker" style="display: inline-block; padding: 6px 14px; border: 3px solid #111111; background: #8ef0b0; font-weight: 800; font-size: 14px; box-shadow: 3px 3px 0 #111111">活潑粗框 · 卡片堆疊架構</span>
<h1 style="margin: 24px 0 0; font-size: 60px; line-height: 1.08; font-weight: 900; letter-spacing: -.02em">有個性、好玩、<br>每個按鈕都想按</h1>
<p style="margin: 20px 0 0; font-size: 18px; color: #3a3a3a; max-width: 480px">粗黑框、偏移硬陰影、飽和色塊。按鈕按下去會「陷進去」，貼紙 hover 會搖晃。適合社團、活動、學生專案、創意作品集。</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 32px; align-items: center">
<button class="press" type="button" style="min-height: 56px; padding: 0 26px; border: 3px solid #111111; border-radius: 12px; background: #ff8fb8; font: inherit; font-weight: 800; font-size: 18px; color: #111111; box-shadow: 6px 6px 0 #111111">按我試試</button>
<button class="press" type="button" onClick="{{like}}" aria-label="喜歡" aria-pressed="{{likedAttr}}" style="width: 56px; height: 56px; border: 3px solid #111111; border-radius: 12px; background: {{likeBg}}; box-shadow: 6px 6px 0 #111111; display: flex; align-items: center; justify-content: center">
<svg class="{{popCls}}" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="{{heartFill}}" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.3 3 4.8 6.4 4.8c2 0 3.6 1.1 4.6 2.7 1-1.6 2.6-2.7 4.6-2.7 3.4 0 5.2 3.5 3.6 6.6C19 15.6 12 20 12 20z"></path></svg>
</button>
<span style="font-weight: 700">{{likeText}}</span>
</div>
</div>

<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 28px">
<div style="position: relative; width: 340px; max-width: 100%; height: 300px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<div class="stackcard" style="position: absolute; inset: 0; box-sizing: border-box; border: 3px solid #111111; border-radius: 20px; background: {{c.bg}}; box-shadow: 8px 8px 0 #111111; padding: 28px; transform: {{c.tf}}; z-index: {{c.z}}">
<div style="font-size: 14px; font-weight: 800">{{c.num}}</div>
<div style="margin-top: 12px; font-size: 30px; font-weight: 900; line-height: 1.15">{{c.title}}</div>
<p style="margin: 12px 0 0; font-size: 16px">{{c.body}}</p>
</div>
</sc-for>
</div>
<button class="press" type="button" onClick="{{next}}" style="min-height: 52px; padding: 0 24px; border: 3px solid #111111; border-radius: 12px; background: #ffffff; font: inherit; font-weight: 800; box-shadow: 5px 5px 0 #111111">下一張卡片</button>
</div>
</section>

<section style="margin-top: 72px; display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 420px; min-width: 0; border: 3px solid #111111; border-radius: 20px; background: #ffffff; box-shadow: 8px 8px 0 #111111; padding: 28px">
<div style="font-size: 24px; font-weight: 900">待辦清單</div>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{todos}}" as="t" hint-placeholder-count="3">
<button class="chk" type="button" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border: 3px solid #111111; border-radius: 12px; background: {{t.bg}}; font: inherit; font-weight: 700; color: #111111; text-align: left">
<span style="flex: 0 0 26px; width: 26px; height: 26px; border: 3px solid #111111; border-radius: 6px; background: #ffffff; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg class="mark" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="transform: {{t.markTf}}"><path d="M4 12.5l5 5L20 6.5"></path></svg>
</span>
<span style="text-decoration: {{t.deco}}">{{t.label}}</span>
</button>
</sc-for>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; border: 3px solid #111111; border-radius: 20px; background: #7cc4ff; box-shadow: 8px 8px 0 #111111; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px">
<div style="font-size: 24px; font-weight: 900">進度</div>
<div style="height: 32px; border: 3px solid #111111; border-radius: 999px; background: #ffffff; overflow: hidden">
<div style="height: 100%; width: {{progress}}; background: #ffd84d; border-right: 3px solid #111111; box-sizing: border-box; transition: width .5s cubic-bezier(.34,1.56,.64,1)"></div>
</div>
<div style="font-size: 18px; font-weight: 800">{{progressText}}</div>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { top: 0, liked: false, pop: 0, done: [true, false, false] }; }
  renderVals() {
    const s = this.state;
    const data = [
      { num: '01', title: '粗框與硬陰影', body: '不用模糊陰影，用純黑偏移塊做出立體感。', bg: '#ffd84d' },
      { num: '02', title: '彈性動畫', body: '動作會稍微超過再彈回，感覺有重量。', bg: '#ff8fb8' },
      { num: '03', title: '飽和色塊', body: '每個區塊一個顏色，靠黑框統一。', bg: '#8ef0b0' }
    ];
    const poses = ['translate(0,0) rotate(0deg)', 'translate(14px,14px) rotate(4deg)', 'translate(28px,28px) rotate(8deg)'];
    const cards = data.map((d, i) => {
      const pos = (i - s.top + 3) % 3;
      return Object.assign({}, d, { tf: poses[pos], z: 3 - pos });
    });
    const labels = ['挑一個喜歡的風格', '決定動畫程度', '開始做第一個頁面'];
    const count = s.done.filter(Boolean).length;
    return {
      cards,
      next: () => this.setState({ top: (s.top + 1) % 3 }),
      like: () => this.setState({ liked: !s.liked, pop: s.pop + 1 }),
      likedAttr: s.liked ? 'true' : 'false',
      likeBg: s.liked ? '#ff8fb8' : '#ffffff',
      heartFill: s.liked ? '#111111' : 'none',
      popCls: s.pop === 0 ? '' : (s.pop % 2 ? 'pa' : 'pb'),
      likeText: s.liked ? '已收藏' : '點愛心看彈跳',
      todos: labels.map((l, i) => ({
        label: l,
        pressed: s.done[i] ? 'true' : 'false',
        bg: s.done[i] ? '#8ef0b0' : '#ffffff',
        deco: s.done[i] ? 'line-through' : 'none',
        markTf: s.done[i] ? 'scale(1)' : 'scale(0)',
        toggle: () => { const d = s.done.slice(); d[i] = !d[i]; this.setState({ done: d }); }
      })),
      progress: Math.round(count / 3 * 100) + '%',
      progressText: '完成 ' + count + ' / 3 項'
    };
  }
}
</script>
</body>
</html>
