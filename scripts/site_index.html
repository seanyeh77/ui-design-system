<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端設計系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dist/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); font-size: 15px; line-height: 1.6; color: var(--ink); background: var(--bg); }
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 12px 32px; background: var(--surface-chrome); border-right: 1px solid var(--line); }
  .brand { padding: 4px 12px 16px; font-size: 17px; font-weight: 700; }
  .grp { margin: 18px 12px 6px; font-size: 13px; font-weight: 700; color: var(--ink-muted); }
  nav a { display: block; padding: 7px 12px; border-radius: var(--radius-md); color: var(--ink); text-decoration: none; font-size: 14px; }
  nav a:hover { background: var(--surface-sub); }
  nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  main { min-width: 0; padding: 32px 40px 64px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 31px; line-height: 1.25; }
  .seg { display: inline-flex; padding: 3px; border-radius: var(--radius-md); background: var(--surface-sub); }
  .seg button { min-height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .frame { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--bg); display: block; }
  .doc { max-width: 820px; margin-top: 28px; }
  .doc h1 { display: none; }
  .doc h2 { margin: 28px 0 8px; font-size: 20px; }
  .doc h3 { margin: 20px 0 6px; font-size: 17px; }
  .doc code { font-family: var(--font-mono); font-size: 13px; padding: 1px 5px; border-radius: 4px; background: var(--surface-sub); }
  .doc pre { overflow-x: auto; padding: 14px 16px; border-radius: var(--radius-md); background: var(--surface-sub); }
  .doc pre code { padding: 0; background: none; }
  .doc table { border-collapse: collapse; } .doc th, .doc td { padding: 6px 10px; border: 1px solid var(--line); text-align: left; }
  .doc a { color: var(--accent-text); }
  @media (max-width: 760px) { .shell { grid-template-columns: 1fr; } nav { position: static; height: auto; } main { padding: 24px 16px 48px; } }
</style>
</head>
<body>
<div class="shell">
  <nav aria-label="目錄" id="nav"></nav>
  <main>
    <div class="bar"><h1 id="title"></h1>
      <div class="seg" role="group" aria-label="主題"><button type="button" data-theme="light">淺色</button><button type="button" data-theme="dark">深色</button></div>
    </div>
    <div id="preview"></div>
    <article class="doc" id="doc"></article>
  </main>
</div>
<script>
  var NAV = __NAV__;
  var theme = 'light';
  try { theme = localStorage.getItem('ds-site-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
  function setTheme(t) {
    theme = t; document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('ds-site-theme', t); } catch (e) {}
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.theme === t)); });
    var f = document.querySelector('.frame'); if (f) f.src = f.dataset.src + '?theme=' + t;
  }
  document.querySelectorAll('.seg button').forEach(function (b) { b.onclick = function () { setTheme(b.dataset.theme); }; });
  var navEl = document.getElementById('nav');
  var html = '<div class="brand">前端設計系統</div><div class="grp">規則</div>';
  NAV.docs.forEach(function (d) { html += '<a href="#/' + d.id + '">' + d.label + '</a>'; });
  NAV.groups.forEach(function (g) {
    html += '<div class="grp">' + g.label + '</div>';
    g.items.forEach(function (n) { html += '<a href="#/' + n + '">' + n + '</a>'; });
  });
  navEl.innerHTML = html;
  function show() {
    var id = decodeURIComponent((location.hash || '#/guidelines').slice(2)) || 'guidelines';
    var doc = NAV.docs.filter(function (d) { return d.id === id; })[0];
    var comp = NAV.components.filter(function (c) { return c.name === id; })[0];
    if (!doc && !comp) { id = 'guidelines'; doc = NAV.docs[0]; }
    navEl.querySelectorAll('a').forEach(function (a) { a.toggleAttribute('aria-current', a.getAttribute('href') === '#/' + id); if (a.hasAttribute('aria-current')) a.setAttribute('aria-current', 'page'); });
    document.getElementById('title').textContent = doc ? doc.label : id;
    document.title = (doc ? doc.label : id) + ' · 前端設計系統';
    var pv = document.getElementById('preview');
    pv.innerHTML = comp ? '<iframe class="frame" title="' + id + ' 預覽" data-src="preview/' + id + '.html" src="preview/' + id + '.html?theme=' + theme + '" style="height:' + comp.height + 'px"></iframe>' : '';
    var md = 'md/' + id + '.md';
    fetch(md).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
      document.getElementById('doc').innerHTML = t ? marked.parse(t) : '';
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  setTheme(theme); show();
</script>
</body>
</html>
