<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>TextField — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 20, padding: 20 } },
          h(U.TextField, { label: '名稱', placeholder: '輸入名稱', hint: '說明文字放在欄位下方' }),
          h(U.TextField, { label: 'Email', type: 'email', defaultValue: 'name@', error: 'Email 格式不正確，例如 name@example.com' }),
          h(U.TextField, { label: '帳號', defaultValue: 'seanyeh', disabled: true }),
        ),
      );
    </script>
  </body>
</html>
