<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>MobileTabBar — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var I = {
        home: U.icons['house'],
        proj: U.icons['folder'],
        users: U.icons['users'],
        chart: U.icons['chart-column'],
        gauge: U.icons['gauge'],
        set: U.icons['sliders-horizontal'],
      };
      function Demo() {
        var v = React.useState('proj'),
          val = v[0],
          setVal = v[1];
        return h(
          'div',
          { style: { maxWidth: 390 } },
          h(U.MobileTabBar, {
            value: val,
            onChange: setVal,
            items: [
              { id: 'home', label: '首頁', icon: I.home },
              { id: 'proj', label: '專案', icon: I.proj },
              { id: 'report', label: '報表', icon: I.chart },
              { id: 'settings', label: '設定', icon: I.set },
            ],
          }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    </script>
  </body>
</html>
