<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>PageHeader — preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: 'var(--space-6)' } },
          h(U.Breadcrumb, { items: [{ label: '訂單', href: '#orders' }, { label: '#1024' }] }),
          h(U.PageHeader, {
            title: '訂單 #1024',
            status: h(U.Badge, { status: 'doing' }, '出貨中'),
            meta: '建立於 2026/11/04（三）· 負責人 王小明',
            primary: { label: '出貨', onClick: function () {} },
            actions: [
              { label: '編輯', icon: 'pencil-simple', onClick: function () {} },
              { label: '列印', icon: 'printer', onClick: function () {} },
            ],
            more: [{ label: '刪除', icon: 'trash', danger: true, confirm: { title: '刪除訂單 #1024？' }, onSelect: function () {} }],
          }),
        ),
      );
    </script>
  </body>
</html>
