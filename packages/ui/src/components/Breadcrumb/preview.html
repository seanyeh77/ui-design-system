<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Breadcrumb — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var I = {
        home: U.icons['house'],
        proj: U.icons['folder'],
        users: U.icons['users'],
        chart: U.icons['chart-column'],
        gauge: U.icons['gauge'],
        set: U.icons['sliders-horizontal'],
      };
      ReactDOM.createRoot(document.getElementById('root')).render(
        h('div', { className: 'ui-row' }, h(U.Breadcrumb, { items: [{ label: '首頁', href: '#' }, { label: '專案', href: '#' }, { label: '叢集監控' }] })),
      );
    </script>
  </body>
</html>
