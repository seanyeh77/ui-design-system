<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Graph — preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var NODES = [
        { id: 'main', x: 240, y: 16, w: 160 },
        { id: 'ibmon_reader_open', x: 20, y: 120, w: 180 },
        { id: 'trace_post_send', x: 230, y: 120, w: 180 },
        { id: 'ibmon_stats_create', x: 440, y: 120, w: 180 },
        { id: 'ibt_span_begin', x: 120, y: 236, w: 170 },
        { id: 'post_send', x: 350, y: 236, w: 170, ext: true },
      ];
      var EDGES = [
        ['main', 'ibmon_reader_open', 0, ''],
        ['main', 'trace_post_send', 1, 'LD_PRELOAD'],
        ['main', 'ibmon_stats_create', 0, ''],
        ['trace_post_send', 'ibt_span_begin', 0, 'ops.c:73'],
        ['trace_post_send', 'post_send', 1, 'ops.c:74'],
      ];
      function node(id) {
        return NODES.find(function (n) {
          return n.id === id;
        });
      }
      function Demo() {
        var s = React.useState('trace_post_send'),
          sel = s[0],
          setSel = s[1];
        function related(e) {
          return !sel || e[0] === sel || e[1] === sel;
        }
        function near(id) {
          return (
            !sel ||
            id === sel ||
            EDGES.some(function (e) {
              return (e[0] === sel || e[1] === sel) && (e[0] === id || e[1] === id);
            })
          );
        }
        return h(
          'div',
          {
            className: 'ui-graph',
            style: {
              maxWidth: 672,
              overflowX: 'auto',
              padding: 16,
              borderRadius: 'var(--radius-lg)',
              background: 'var(--surface)',
              boxShadow: 'var(--shadow-card)',
            },
          },
          h(
            'svg',
            { viewBox: '0 0 640 300', width: 640, height: 300, role: 'img', 'aria-label': '架構圖' },
            h(U.GraphDefs),
            EDGES.map(function (e, i) {
              var a = node(e[0]),
                b = node(e[1]),
                sx = a.x + a.w / 2,
                sy = a.y + 40,
                tx = b.x + b.w / 2,
                ty = b.y - 2,
                my = sy + 24,
                on = sel && related(e);
              return h(
                'g',
                { key: i, className: related(e) ? '' : 'is-dim' },
                h('path', {
                  d: 'M' + sx + ' ' + sy + ' V' + my + ' H' + tx + ' V' + ty,
                  className: 'ui-graph-edge' + (e[2] ? ' is-inferred' : '') + (on ? ' is-related' : ''),
                  markerEnd: on ? 'url(#ui-arrow-accent)' : 'url(#ui-arrow)',
                }),
                e[3]
                  ? h(
                      'text',
                      { x: tx + 8, y: (my + ty) / 2 + 2, dominantBaseline: 'central', className: 'ui-graph-label' + (on ? ' is-related' : '') },
                      h('tspan', { className: 'ui-graph-code' }, e[3]),
                    )
                  : null,
              );
            }),
            NODES.map(function (n) {
              return h(
                'g',
                {
                  key: n.id,
                  className: near(n.id) ? '' : 'is-dim',
                  style: { cursor: 'pointer' },
                  onClick: function () {
                    setSel(sel === n.id ? null : n.id);
                  },
                },
                h('rect', {
                  x: n.x,
                  y: n.y,
                  width: n.w,
                  height: 40,
                  rx: 10,
                  className: 'ui-graph-node' + (n.ext ? ' is-external' : '') + (n.id === sel ? ' is-selected' : ''),
                }),
                h('text', { x: n.x + n.w / 2, y: n.y + 20, textAnchor: 'middle', dominantBaseline: 'central', className: 'ui-graph-name' }, n.id),
              );
            }),
          ),
          h(U.GraphLegend, {
            items: [
              { type: 'edge', label: '編譯器確認' },
              { type: 'inferred', label: '推測（規則）', text: '由規則推得，編譯器無法確認。' },
              { type: 'external', label: '外部函式' },
            ],
          }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    </script>
  </body>
</html>
