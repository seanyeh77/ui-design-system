<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Dialog — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { style: { padding: 20 } },
          h(
            U.Dialog,
            {
              title: '刪除這個專案？',
              modal: false,
              onClose: function () {},
              actions: h(React.Fragment, null, h(U.Button, null, '取消'), h(U.Button, { variant: 'danger', confirmed: true }, '刪除')),
            },
            '專案內的 12 個任務會一起刪除，這個動作無法復原。',
          ),
        ),
      );
    </script>
  </body>
</html>
