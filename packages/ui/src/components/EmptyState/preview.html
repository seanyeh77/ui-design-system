<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>EmptyState — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(U.EmptyState, {
          title: '三步驟開始使用',
          description: '建立第一個專案後，成員、任務與進度都會顯示在這裡。',
          steps: ['建立專案', '邀請成員', '新增第一個任務'],
          current: 0,
          action: h(U.Button, null, '新增'),
        }),
      );
    </script>
  </body>
</html>
