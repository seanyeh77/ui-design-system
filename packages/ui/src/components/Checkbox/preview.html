<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Checkbox — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var S = React.useState;
      function D() {
        var a = S(true),
          b = S(false);
        return h(
          'div',
          { style: { display: 'flex', flexDirection: 'column', padding: 20 } },
          h(U.Checkbox, { label: '寄送每週摘要', checked: a[0], onChange: a[1] }),
          h(U.Checkbox, { label: '訂閱產品更新', checked: b[0], onChange: b[1] }),
          h(U.Checkbox, { label: '部分選取', checked: 'mixed' }),
          h(U.Checkbox, { label: '停用', disabled: true }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
