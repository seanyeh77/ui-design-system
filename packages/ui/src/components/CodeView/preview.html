    <div id="root"></div>
    <script>

        h = React.createElement;
      var code = [
        'int trace_post_send(struct ibv_qp *qp, struct ibv_send_wr *wr, struct ibv_send_wr **bad_wr)',
        '{',
        '    struct app_hook_context *h = app_hook_context_get(qp->context, APP_HOOK_POST_SEND, __func__);',
        '    int ret;',
        '    app_span_begin(ctx, OP_POST_SEND);',

        '    app_span_end_args(ctx, OP_POST_SEND, wr->num_sge, ret);',
        '    return ret;',
        '}',
      ].join('\n');
      // Names that are links: hold Ctrl or ⌘ and click, or Tab into the code and use ← → and Enter.
      var links = [
        { line: 72, text: 'app_hook_context_get', label: 'app_hook_context_get，定義在 src/server/hook.c:88', def: 'src/server/hook.c:88' },
        { line: 74, text: 'app_span_begin', label: 'app_span_begin，定義在 src/server/span.c:31', def: 'src/server/span.c:31' },
        { line: 76, text: 'app_span_end_args', label: 'app_span_end_args，定義在 src/server/span.c:57', def: 'src/server/span.c:57' },
      ];
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { style: { maxWidth: 620 } },
          h(U.CodeView, {
            file: 'src/server/hooks/ops.c',
            fileHref: '#',
            code: code,
            start: 70,
            target: 75,
            links: links,
            // Words in comments and strings with an explanation: dashed underline, card after 500 ms.
            terms: [
              { term: 'original', text: '原本函式庫裡的 `post_send`；追蹤函式庫攔截後再呼叫它。', action: { label: '看它出現的地方', onClick: function () {} } },
            ],
            onLink: function () {},
            preview: function (l) {
              return h(
                'div',
                null,
                h('div', { style: { fontFamily: 'var(--font-mono)', fontWeight: 600 } }, l.text),
                h('div', null, '定義在 ', h(U.InlineCode, { href: '#' }, l.def)),
              );
            },
          }),
        ),
      );
    </script>
  </body>
