<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>SettingsLayout — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      function D() {
        var t = React.useState(''),
          n = React.useState('SeanYeh'),
          a = React.useState(true),
          tm = React.useRef(null);
        function saved() {
          t[1]('已儲存');
          clearTimeout(tm.current);
          tm.current = setTimeout(function () {
            t[1]('');
          }, 3000);
        }
        return h(
          'div',
          { style: { padding: 20, height: 520, boxSizing: 'border-box', overflow: 'auto' } },
          h(U.SettingsLayout, {
            title: '設定',
            toast: t[0],
            categories: [
              {
                id: 'profile',
                label: '個人資料',
                content: h(
                  U.SettingsSection,
                  { title: '個人資料' },
                  h(U.TextField, {
                    label: '名稱',
                    value: n[0],
                    onChange: function (e) {
                      n[1](e.target.value);
                    },
                    onBlur: saved,
                  }),
                ),
              },
              {
                id: 'noti',
                label: '通知',
                content: h(
                  U.SettingsSection,
                  { title: '通知', description: '改完會自動儲存。' },
                  h(
                    'label',
                    { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                    'Email 通知',
                    h(U.Switch, {
                      label: 'Email 通知',
                      checked: a[0],
                      onChange: function (v) {
                        a[1](v);
                        saved();
                      },
                    }),
                  ),
                ),
              },
              {
                id: 'security',
                label: '安全性',
                content: h(
                  React.Fragment,
                  null,
                  h(U.SettingsSection, { title: '安全性' }, '兩步驟驗證、登入紀錄'),
                  h(U.DangerZone, { title: '刪除帳號', description: '刪除後，所有專案和資料都無法復原。', actionLabel: '刪除帳號', onAction: function () {} }),
                ),
              },
            ],
          }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
