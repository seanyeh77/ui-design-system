<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>Tabs — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
  var U = window.UI, h = React.createElement;
  var I = { home: U.icons['house'], proj: U.icons['folder'], users: U.icons['users'], chart: U.icons['chart-column'], gauge: U.icons['gauge'], set: U.icons['sliders-horizontal'] };
  function Demo() {
    var v = React.useState('a'), val = v[0], setVal = v[1];
    var data = { a: ['網站改版', '叢集監控', '課程平台'], b: ['部署 web-frontend', '更新文件', '修正登入'], c: ['[成員一]', '[成員二]', '[成員三]'] };
    return h('div', { className: 'ui-stack' },
      h('div', null, h(U.Tabs, { label: '檢視', value: val, onChange: setVal, items: [{ id: 'a', label: '總覽' }, { id: 'b', label: '任務' }, { id: 'c', label: '成員' }] })),
      h('div', { key: val, className: 'ui-rise-in', style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 12 } },
        data[val].map(function (t) { return h('div', { key: t, style: { height: 90, padding: 14, boxSizing: 'border-box', borderRadius: 14, background: 'var(--surface)', boxShadow: 'var(--shadow-card)', fontWeight: 700 } }, t); })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
