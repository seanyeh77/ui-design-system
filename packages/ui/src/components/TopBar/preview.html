<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>TopBar — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var I = {
        home: U.icons['house'],
        proj: U.icons['folder'],
        users: U.icons['users'],
        chart: U.icons['chart-column'],
        gauge: U.icons['gauge'],
        set: U.icons['sliders-horizontal'],
      };
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          U.TopBar,
          { title: '叢集監控', onSearch: function () {} },
          h('span', { style: { width: 36, height: 36, borderRadius: 99, background: 'var(--surface-sub)', border: '1px solid var(--line)' } }),
        ),
      );
    </script>
  </body>
</html>
