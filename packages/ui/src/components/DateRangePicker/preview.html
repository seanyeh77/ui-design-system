<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>DateRangePicker — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
  var U = window.UI, h = React.createElement;
  function D(){var t=new Date();t.setHours(0,0,0,0);var v=React.useState([new Date(t.getFullYear(),t.getMonth(),t.getDate()-6),t]); return h('div',{style:{padding:20,minHeight:420}}, h(U.DateRangePicker,{label:'報表期間',value:v[0],onChange:v[1]}));}
  ReactDOM.createRoot(document.getElementById('root')).render(h(D));
</script>
</body>
</html>
