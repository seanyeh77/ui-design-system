<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Badge — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var all = ['draft', 'doing', 'review', 'done', 'fail', 'closed', 'online', 'offline'];
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'ui-stack' },
          h(
            'div',
            { className: 'ui-row' },
            all.map(function (s) {
              return h(U.Badge, { key: s, status: s });
            }),
          ),
          h(
            U.Card,
            { title: '訂單狀態' },
            h(
              'div',
              { className: 'ui-row', style: { padding: 0 } },
              h(U.Badge, { tone: 'neutral' }, '待付款'),
              h(U.Badge, { tone: 'info' }, '出貨中'),
              h(U.Badge, { tone: 'success' }, '已付款'),
              h(U.Badge, { tone: 'warning' }, '庫存不足'),
              h(U.Badge, { tone: 'danger' }, '付款失敗'),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
