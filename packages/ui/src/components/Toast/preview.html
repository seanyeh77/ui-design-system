<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Toast — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      function Demo() {
        var n = React.useState(3);
        return h(
          'div',
          { className: 'ui-stack' },
          h(
            'div',
            { className: 'ui-row' },
            h(
              U.Button,
              {
                onClick: function () {
                  U.toast('已儲存變更');
                },
              },
              '儲存',
            ),
            h(
              U.Button,
              {
                onClick: function () {
                  U.toast('已刪除 ' + n[0] + ' 筆', {
                    action: {
                      label: '復原',
                      undo: true,
                      onAction: function () {
                        U.toast('已復原 ' + n[0] + ' 筆', { tone: 'info' });
                      },
                    },
                  });
                },
              },
              '刪除',
            ),
          ),
          h(U.Toast, null, '已儲存變更'),
          h(U.Toast, { tone: 'danger' }, '儲存失敗：網路中斷，請稍後再試'),
          h(U.Toaster),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    </script>
  </body>
</html>
