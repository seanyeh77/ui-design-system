<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>ProjectSwitcher — preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      function Demo() {
        var s = React.useState('web-build');
        return h(
          'div',
          { style: { display: 'flex', justifyContent: 'flex-end', padding: '8px 4px' } },
          h(U.ProjectSwitcher, {
            project: 'web-app',
            status: 'live',
            value: s[0],
            onChange: s[1],
            options: [
              { id: 'web-build', label: 'web-app', detail: 'build 環境' },
              { id: 'web-rt', label: 'web-app', detail: 'runtime 環境' },
              { id: 'api', label: 'api-server', detail: 'build 環境' },
            ],
            footer: h(U.Link, { href: '#sources' }, '所有資料來源設定'),
          }),
        );
      }
      // One top bar (one header on the page) with a page title, search, help and the switcher with a long status. On a
      // phone the status is the mark and the name stays whole; short of room the status words go first, whole.
      function Bar(props) {
        var s = React.useState('live');
        return h(
          'div',
          { style: { maxWidth: props.width, marginTop: 16, border: '1px solid var(--line)', borderRadius: 'var(--radius-md)' } },
          h(
            U.TopBar,
            { title: '檢查筆記', searchLabel: '搜尋', onSearch: function () {} },
            h(U.IconButton, { icon: 'question', label: '重看導覽' }),
            h(U.ProjectSwitcher, {
              project: 'web-app',
              status: s[0] === 'live' ? 'live' : 'stale',
              statusLabel: s[0] === 'live' ? '即時' : '快照 a085bc3',
              value: s[0],
              onChange: s[1],
              options: [
                { id: 'live', label: 'web-app', detail: 'localhost 即時' },
                { id: 'snap', label: 'web-app', detail: '快照 a085bc3' },
              ],
            }),
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h('div', null, h(Demo), h(Bar, { width: 520 })));
    </script>
  </body>
</html>
