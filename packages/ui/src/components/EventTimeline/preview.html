<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>EventTimeline — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var card = { padding: '16px 20px', borderRadius: 'var(--radius-lg)', background: 'var(--surface)', boxShadow: 'var(--shadow-card)' };
      var t = function (hh, mm) {
        return new Date(2026, 10, 20, hh, mm);
      };
      var EVENTS = [
        { time: t(14, 10), kind: 'alert', text: 'B 區進氣溫度到達注意線 27 °C' },
        { time: t(16, 20), kind: 'alert', text: 'F 區進氣溫度超過上限 29 °C' },
        { time: t(16, 5), kind: 'switch', text: '控制從 PID 切回 AI 最佳化' },
        { time: t(15, 42), kind: 'ai', text: 'AI 調高 2 號空調風量 10%' },
        { time: t(14, 58), kind: 'manual', text: '值班人員把 B 區設定溫度改成 24 °C' },
      ];
      function D() {
        return h(
          'div',
          { style: { padding: 20, display: 'grid', gap: 16, maxWidth: 460 } },
          h('div', { style: card }, h(U.EventTimeline, { label: '近 4 小時的事件', events: EVENTS, empty: '近 4 小時沒有事件' })),
          h('div', { style: card }, h(U.EventTimeline, { label: '近 4 小時的事件', events: [], empty: '近 4 小時沒有事件' })),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
