<!-- @dsCard group="Data" height=640 -->
<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>EventTimeline — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var t = function (hh, mm) {
        return new Date(2026, 10, 20, hh, mm);
      };
      var EVENTS = [
        { time: t(14, 10), kind: 'alert', text: 'B 區進氣溫度到達注意線 27 °C' },
        { time: t(16, 20), kind: 'alert', text: 'F 區進氣溫度超過上限 29 °C' },
        { time: t(16, 5), kind: 'switch', text: '控制從 PID 切回 AI 最佳化' },
        { time: t(15, 42), kind: 'ai', text: 'AI 調高 2 號空調風量 10%' },
        { time: t(14, 58), kind: 'manual', text: '值班人員把 B 區設定溫度改成 24 °C' },
      ];
      function D() {
        return h(
          'div',
          { style: { padding: 20, display: 'grid', gap: 16, maxWidth: 520 } },
          h(U.Card, { title: '近 4 小時的事件' }, h(U.EventTimeline, { label: '近 4 小時的事件', events: EVENTS, empty: '近 4 小時沒有事件' })),
          h(
            U.Card,
            { title: '訂單 #1024 的紀錄' },
            h(U.EventTimeline, {
              label: '訂單 #1024 的紀錄',
              kinds: {
                created: { icon: 'plus', label: '建立' },
                paid: { icon: 'check-circle', label: '付款', tone: 'success' },
                refund: { icon: 'arrow-u-up-left', label: '退款', tone: 'warning' },
              },
              events: [
                { time: new Date(2026, 10, 24, 15, 2), kind: 'refund', text: '退回 1 件商品 NT$ 320', actor: '林小姐' },
                { time: new Date(2026, 10, 24, 9, 12), kind: 'paid', text: '信用卡付款 NT$ 1,280', actor: '王小明' },
                { time: new Date(2026, 10, 23, 18, 40), kind: 'created', text: '建立訂單', actor: '王小明' },
              ],
            }),
          ),
          h(U.Card, { title: '近 1 小時的事件' }, h(U.EventTimeline, { label: '近 1 小時的事件', events: [], empty: '近 1 小時沒有事件' })),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
