<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>AccentPicker — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      function D() {
        var v = React.useState('#2457d6');
        var t = React.useState('a');
        // Applied to the page (not stored), so the samples below show accent-text for the chosen color.
        React.useEffect(
          function () {
            U.setAccent(v[0], true);
          },
          [v[0]],
        );
        return h(
          'div',
          { style: { padding: 20, display: 'flex', flexDirection: 'column', gap: 12 } },
          h('div', { style: { fontWeight: 700 } }, '強調色'),
          h(U.AccentPicker, { value: v[0], onChange: v[1] }),
          h(
            'div',
            { style: { display: 'flex', gap: 8, alignItems: 'center' } },
            h('span', { style: { width: 16, height: 16, borderRadius: 4, background: v[0] } }),
            h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 13 } }, v[0]),
          ),
          // Text in the accent: links, a selected tab, a status; the button and the bar keep the accent itself.
          h(
            'div',
            { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center' } },
            h(U.Tabs, {
              label: '範例分頁',
              value: t[0],
              onChange: t[1],
              unit: '筆',
              items: [
                { id: 'a', label: '全部', count: 12 },
                { id: 'b', label: '錯誤', count: 3 },
              ],
            }),
            h(U.Badge, { status: 'doing' }),
            h(U.InlineCode, { href: '#src/theme.ts:78' }, 'src/theme.ts:78'),
            h(U.Button, { variant: 'primary' }, '儲存'),
          ),
          h(U.Alert, { tone: 'info', title: '已套用強調色' }, '連結與選中的文字自動加深到 4.5:1。'),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
