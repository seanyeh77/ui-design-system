<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Button — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      function Demo() {
        var s = React.useState(false),
          saving = s[0],
          set = s[1];
        function save() {
          set(true);
          setTimeout(function () {
            set(false);
          }, 1400);
        }
        return h(
          'div',
          { className: 'ui-stack' },
          h(
            'div',
            { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
            h(U.Button, { variant: 'primary', onClick: save, loading: saving }, saving ? '儲存中' : '儲存'),
            h(U.Button, null, '取消'),
            h(U.Button, { variant: 'danger' }, '刪除'),
          ),
          h(
            'div',
            { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
            h(U.Button, { variant: 'primary', disabled: true }, '無法使用'),
            h(U.Button, { disabled: true }, '無法使用'),
            h(U.Button, { variant: 'primary', icon: U.icons['plus'] }, '新增'),
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    </script>
  </body>
</html>
