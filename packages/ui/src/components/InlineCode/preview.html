<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>InlineCode — preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var rows = [
        { id: 3, loc: 'notes.md:3', st: 'done', note: '`ibmon_spawn` 在 `child.c:86` 設定 `IBTRACE_SHM`', expl: '行號存在，該行提到 `IBTRACE_SHM`。' },
        {
          id: 4,
          loc: 'notes.md:4',
          st: 'review',
          note: '`ibt_attach` 是 constructor，在 `trace.c:321-322`',
          expl: '行號存在，但該行沒有 constructor 屬性。請確認是否指 `trace.c:318`。',
        },
        { id: 7, loc: 'notes.md:7', st: 'fail', note: '`ring_push` 在 `ring.c:140` 寫入共享記憶體', expl: '`ring.c` 只有 128 行，行號超出檔案。' },
        { id: 9, loc: 'notes.md:9', st: 'done', note: '`IBTRACE_SHM` 由 `env.c:22` 讀取', expl: '行號存在，該行讀取 `IBTRACE_SHM`。' },
        {
          id: 12,
          loc: 'notes.md:12',
          st: 'fail',
          note: '`flush_ring` 在 `ring.c:96` 把資料寫回檔案，並在結束前呼叫 `msync` 確保資料寫到磁碟',
          expl: '該行找不到 `flush_ring`；最接近的定義在 `ring.c:104`。',
        },
      ];
      var L = { done: '正確', review: '要確認', fail: '錯誤' };
      function Demo() {
        var s = React.useState(''),
          note = s[0],
          setNote = s[1];
        var open = function (ref) {
          setNote('開啟 ' + ref);
        };
        return h(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
          h('p', { style: { margin: 0 } }, h(U.CodeText, { text: '`ibmon_spawn` 在 `child.c:86` 設定 `IBTRACE_SHM`，由 `env.c:22` 讀取。', onRef: open })),
          h(U.DataTable, {
            label: '檢查結果',
            rows: rows,
            search: false,
            columnMenu: false,
            urlSync: false,
            summary: {
              key: 'st',
              items: [
                { value: 'fail', label: '錯誤' },
                { value: 'review', label: '要確認' },
                { value: 'done', label: '正確' },
              ],
            },
            columns: [
              {
                key: 'loc',
                label: '位置',
                width: 120,
                mobile: 'title',
                render: function (r) {
                  return h(
                    U.InlineCode,
                    {
                      onClick: function () {
                        open(r.loc);
                      },
                    },
                    r.loc,
                  );
                },
              },
              {
                key: 'note',
                label: '筆記內容',
                width: 240,
                grow: 2,
                long: true,
                render: function (r) {
                  return h(U.CodeText, { text: r.note, onRef: open });
                },
              },
              {
                key: 'st',
                label: '結果',
                width: 110,
                mobile: 'status',
                render: function (r) {
                  return h(U.Badge, { status: r.st }, L[r.st]);
                },
              },
              {
                key: 'expl',
                label: '說明',
                width: 240,
                grow: 2,
                long: true,
                render: function (r) {
                  return h(U.CodeText, { text: r.expl, onRef: open });
                },
              },
            ],
          }),
          h('div', { style: { minHeight: 20, fontSize: 13, color: 'var(--ink-muted)' } }, note),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    </script>
  </body>
</html>
