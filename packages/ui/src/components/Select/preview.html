<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Select — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var S = React.useState;
      var cities = ['台北', '新北', '桃園', '台中', '台南', '高雄', '基隆', '新竹', '嘉義', '苗栗', '彰化', '南投', '雲林', '屏東', '宜蘭', '花蓮', '台東'].map(
        function (c) {
          return { value: c, label: c };
        },
      );
      function D() {
        var a = S('week'),
          b = S('');
        return h(
          'div',
          { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))', gap: 20, padding: 20, minHeight: 380, alignItems: 'start' } },
          h(U.Select, {
            label: '頻率（3 個選項）',
            value: a[0],
            onChange: a[1],
            options: [
              { value: 'day', label: '每天' },
              { value: 'week', label: '每週' },
              { value: 'month', label: '每月' },
            ],
          }),
          h(U.Select, { label: '城市（17 個選項）', required: true, value: b[0], onChange: b[1], options: cities }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
