<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>BarChart — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var V = [12, 18, 15, 22, 26, 24, 31, 29, 35, 33, 38, 42];
      function D() {
        return h(
          'div',
          { style: { padding: '20px 20px 20px 8px', maxWidth: 560 } },
          h(U.BarChart, {
            label: '每月新增專案',
            unit: '個',
            data: V.map(function (v, i) {
              return { label: i + 1 + ' 月', short: String(i + 1), value: v };
            }),
          }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
