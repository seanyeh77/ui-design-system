<!-- @dsCard group="Data" height=2280 -->
<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>DataTable — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var NAMES = [
        '叢集監控',
        '帳號整合',
        '資料備份',
        '成本報表',
        '日誌搜尋',
        '告警通知',
        '權限管理',
        '容器部署',
        '效能分析',
        '使用者回饋',
        'API 閘道',
        '排程系統',
        '檔案上傳',
        '計費模組',
        '行動版首頁',
        '搜尋最佳化',
        '設計系統',
        '資料匯入',
        '安全稽核',
        '文件網站',
        '模型推論',
        '儲存擴充',
        '網路拓樸',
        '測試平台',
      ];
      var OWN = ['王小明', '李小華', '陳大同', '林美玲', '張志豪', '黃雅婷'],
        ST = ['draft', 'doing', 'review', 'done', 'fail'];
      var rows = NAMES.map(function (n, i) {
        return {
          id: i + 1,
          name: n,
          owner: OWN[(i * 5 + 1) % 6],
          status: ST[(i * 7 + 2) % 5],
          progress: [12, 64, 88, 100, 40, 25, 72, 100, 55, 90, 33, 100, 8, 61, 100, 47, 79, 18, 100, 66, 52, 95, 30, 84][i],
          budget: (((i * 137) % 23) + 2) * 85000,
          // 2026/10/01 to 2026/11/04, one per row
          updated: '2026-' + (i < 10 ? '10-' + String(i * 3 + 1).padStart(2, '0') : '11-0' + ((i % 4) + 1)),
        };
      });
      var STL = { draft: '草稿', doing: '進行中', review: '審核中', done: '完成', fail: '失敗' };
      // The defaults from plain columns: the main text column first takes the room left; status, source, length, words
      // and date hug their content. Failed rows say why in a second line and offer 「重試」; running rows say how far.
      var NOW = Date.now();
      function ago(h) {
        return new Date(NOW - h * 3600000).toISOString();
      }
      var JOBS = [
        { id: 't1', title: '第 12 次週會錄音', status: 'doing', source: 'YouTube', secs: 2802, words: 6120, created: ago(0.4), note: '處理中 42%' },
        { id: 't2', title: '產品訪談：物流業者', status: 'fail', source: '上傳', secs: 6889, words: 0, created: ago(3), note: '音訊格式不支援，請轉成 MP3 後重試' },
        { id: 't3', title: '課程錄影 第 3 週：作業系統排程', status: 'done', source: 'Google Drive', secs: 5410, words: 21980, created: ago(26) },
        { id: 't4', title: '客服通話抽樣', status: 'done', source: '上傳', secs: 1530, words: 5210, created: ago(50) },
        { id: 't5', title: 'Podcast 第 48 集', status: 'done', source: 'YouTube', secs: 3725, words: 15402, created: ago(120) },
        { id: 't6', title: '董事會會議（上半場）', status: 'fail', source: '上傳', secs: 90, words: 0, created: ago(180), note: '檔案只有 1:30，可能上傳不完整' },
        { id: 't7', title: '新人訓練：資安基礎', status: 'done', source: 'Google Drive', secs: 2210, words: 8930, created: ago(300) },
      ];
      var JSL = { doing: '進行中', fail: '失敗', done: '完成' };
      function Jobs() {
        return h(
          'div',
          { style: { padding: 20 } },
          h(U.DataTable, {
            caption: '處理紀錄',
            rows: JOBS,
            urlKey: 'jobs',
            selectable: true,
            search: { placeholder: '搜尋標題、來源' },
            summary: {
              key: 'status',
              items: [
                { value: 'doing', label: '進行中' },
                { value: 'done', label: '完成' },
                { value: 'fail', label: '失敗' },
              ],
            },
            filters: [{ key: 'source', label: '來源' }],
            bulkActions: function (ids, clear) {
              return h(U.Button, { variant: 'secondary', onClick: clear }, '重試');
            },
            rowActions: function (r) {
              return r.status === 'fail' ? h(U.IconButton, { label: '重試 ' + r.title, icon: U.icons['arrows-clockwise'] }) : null;
            },
            columns: [
              {
                key: 'title',
                label: '標題',
                secondary: function (r) {
                  return r.note;
                },
              },
              {
                key: 'status',
                label: '狀態',
                mobile: 'status',
                render: function (r) {
                  return h(U.Badge, { status: r.status }, JSL[r.status]);
                },
                searchText: function (r) {
                  return JSL[r.status];
                },
              },
              { key: 'source', label: '來源' },
              { key: 'secs', label: '長度', format: 'duration' },
              { key: 'words', label: '字數', numeric: true, unit: '字' },
              { key: 'created', label: '建立時間', format: 'relative' },
            ],
          }),
        );
      }
      function D() {
        return h(
          'div',
          { style: { padding: 20 } },
          h(U.DataTable, {
            caption: '專案',
            rows: rows,
            selectable: true,
            search: { placeholder: '搜尋名稱、負責人、狀態' },
            filters: [
              {
                key: 'status',
                label: '狀態',
                options: ST.map(function (s) {
                  return { value: s, label: STL[s] };
                }),
              },
              { key: 'owner', label: '負責人' },
              { key: 'budget', label: '預算', type: 'range', scale: 10000, unitLabel: '單位：萬' },
            ],
            totals: { budget: 'sum', progress: 'avg' },
            bulkActions: function (ids, clear) {
              return [
                h(U.Button, { key: 'e', variant: 'secondary', onClick: clear }, '匯出'),
                h(
                  U.Button,
                  { key: 'd', variant: 'danger', confirm: { title: '刪除 ' + ids.length + ' 筆專案？', body: '刪除後無法復原。' }, onClick: clear },
                  '刪除',
                ),
              ];
            },
            rowActions: function (r) {
              return [
                h(U.IconButton, { key: 'e', label: '編輯 ' + r.name, icon: U.icons['pencil-simple'] }),
                h(U.IconButton, { key: 'd', label: '刪除 ' + r.name, icon: U.icons.trash }),
              ];
            },
            columns: [
              {
                key: 'name',
                label: '名稱',
                render: function (r) {
                  return h('strong', null, r.name);
                },
              },
              { key: 'owner', label: '負責人' },
              {
                key: 'status',
                label: '狀態',
                mobile: 'status',
                sortValue: function (r) {
                  return ST.indexOf(r.status);
                },
                searchText: function (r) {
                  return STL[r.status];
                },
                render: function (r) {
                  return h(U.Badge, { status: r.status });
                },
              },
              { key: 'progress', label: '進度', format: 'percent', decimals: 0, unit: '%' },
              { key: 'budget', label: '預算', format: 'money' },
              // Off at first: turn it on in 「欄位」.
              { key: 'updated', label: '更新日期', format: 'date', hidden: true },
            ],
          }),
        );
      }
      // long text in narrow columns: the caret on the left opens the row's long columns in full
      var CHECKS = [
        {
          id: 'k1',
          fn: 'worker_spawn',
          ok: true,
          note: '先 fork 再 execve，子行程繼承 APP_SHM；父行程等到 ring 建好才回傳，避免子行程搶先寫入。',
          desc: '預測和實際呼叫順序一致。setenv 在 fork 之前，所以子行程一定看得到環境變數。',
        },
        {
          id: 'k2',
          fn: 'ring_push',
          ok: false,
          note: '以為滿了會覆蓋最舊的資料，實際上回傳 -EAGAIN 並丟掉新的一筆，呼叫端沒有檢查回傳值。',
          desc: '要確認：ucx_ib_test 在 ring 滿時是否需要重試。目前會默默少一筆統計。',
        },
        { id: 'k3', fn: 'hook_ucp_put', ok: true, note: '攔截後記錄大小與時間，再呼叫原本的 ucp_put_nbx。', desc: '和讀程式碼的結果相同。' },
      ];
      function Long() {
        return h(
          'div',
          { style: { padding: '0 20px 20px', maxWidth: 600 } },
          h(U.DataTable, {
            caption: '檢查筆記',
            rows: CHECKS,
            urlSync: false,
            search: false,
            columns: [
              { key: 'fn', label: '函式', width: 128 },
              {
                key: 'ok',
                label: '結果',
                width: 88,
                render: function (r) {
                  return h(U.Badge, { status: r.ok ? 'done' : 'fail' }, r.ok ? '正確' : '錯誤');
                },
                searchText: function (r) {
                  return r.ok ? '正確' : '錯誤';
                },
              },
              { key: 'note', label: '筆記內容', long: true, width: 160 },
              { key: 'desc', label: '說明', long: true, width: 160 },
            ],
          }),
        );
      }
      // A 檢查筆記 summary in English: four states with counts. On a phone the row scrolls; the
      // selected state scrolls into view.
      function Summary() {
        var many = CHECKS.concat(
          CHECKS.map(function (c) {
            return Object.assign({}, c, { id: c.id + 'b', state: 'review' });
          }),
        ).map(function (c, i) {
          return Object.assign({ state: c.ok ? 'match' : 'wrong' }, c, { id: 'S' + i });
        });
        return h(
          'div',
          { style: { padding: '0 20px 20px', maxWidth: 600 } },
          h(U.DataTable, {
            caption: 'Check notes',
            rows: many,
            urlSync: false,
            search: false,
            summary: {
              key: 'state',
              label: 'Filter by result',
              unit: function (n) {
                return n === 1 ? 'item' : 'items';
              },
              items: [
                { value: 'wrong', label: 'Wrong' },
                { value: 'review', label: 'To review' },
                { value: 'match', label: 'Matches' },
                { value: 'indirect', label: 'Indirect' },
              ],
            },
            columns: [
              { key: 'fn', label: 'Function', width: 128 },
              { key: 'note', label: 'Note', long: true, width: 160 },
            ],
          }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h('div', null, h(Jobs), h(D), h(Long), h(Summary)));
    </script>
  </body>
</html>
