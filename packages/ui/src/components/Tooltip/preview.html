<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Tooltip — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      function D() {
        return h(
          'div',
          { style: { display: 'flex', gap: 8, padding: '48px 20px 20px' } },
          h(U.IconButton, { label: '重新整理', icon: U.icons['refresh-cw'] }),
          h(U.IconButton, { label: '匯出', icon: U.icons['download'] }),
          h(U.Tooltip, { label: '只有管理員可以封存' }, h(U.Button, { variant: 'secondary' }, '封存')),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
