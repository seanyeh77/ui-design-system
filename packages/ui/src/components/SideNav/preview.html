<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>SideNav — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      var I = {
        home: U.icons['house'],
        proj: U.icons['folder'],
        users: U.icons['users'],
        chart: U.icons['chart-column'],
        gauge: U.icons['gauge'],
        set: U.icons['sliders-horizontal'],
      };
      function Demo() {
        var v = React.useState('home'),
          val = v[0],
          setVal = v[1];
        var c = React.useState(false),
          col = c[0],
          setCol = c[1];
        return h(
          'div',
          { style: { height: 520, display: 'flex' } },
          h(U.SideNav, {
            value: val,
            onChange: setVal,
            collapsed: col,
            onToggle: function () {
              setCol(!col);
            },
            brand: h(
              React.Fragment,
              null,
              h('span', { style: { flex: '0 0 24px', width: 24, height: 24, borderRadius: 6, background: 'var(--accent)' } }),
              col ? null : h('span', null, '[專案名稱]'),
            ),
            sections: [
              {
                items: [
                  { id: 'home', label: '首頁', icon: I.home },
                  {
                    id: 'proj',
                    label: '專案',
                    icon: I.proj,
                    children: [
                      { id: 'active', label: '進行中' },
                      { id: 'archived', label: '已封存' },
                    ],
                  },
                  { id: 'users', label: '成員', icon: I.users },
                ],
              },
              {
                items: [
                  { id: 'report', label: '報表', icon: I.chart },
                  { id: 'usage', label: '用量', icon: I.gauge },
                ],
              },
              { items: [{ id: 'settings', label: '設定', icon: I.set }] },
            ],
          }),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    </script>
  </body>
</html>
