<!-- @dsCard height=288 -->
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>前端設計系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--accent); }
  .deep { fill:var(--ink); }
  .relief { fill:var(--neutral-300); }
  .tile { fill:var(--accent-text); rx:var(--radius-sm); }
  .tile.ok { fill:var(--success); }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:72px; line-height:.95; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 160x230 slab bled off the top (the one brand hue, largest) · ink 280x112 bleeding off the right edge (the deep surface) · neutral-300 96x112 relief tint bled right · success once as a single tile (it only ever means a state)
  arrangement one tall accent slab with a modular block of tiles beside it, the ink band beneath, bottoms on one line space-6 above the edge
  pattern     tiles, from "dense UI on a 12-column grid, layers by shadow not borders": 32 px tiles on a space-2 gap, some merged two-wide like spanning grid cells, in accent-text
  scales      tiles 32 = space-8, gaps space-2, insets space-6; corners radius-lg for blocks, radius-sm for tiles
-->
<rect class="brand blk" x="24" y="-14" width="160" height="230" rx="14"/>
<rect class="relief blk" x="384" y="24" width="110" height="112" rx="14"/>
<rect class="deep blk" x="200" y="152" width="300" height="112" rx="14"/>
<rect class="tile" x="200" y="24" width="72" height="32" rx="6"/>
<rect class="tile" x="280" y="24" width="32" height="32" rx="6"/>
<rect class="tile" x="320" y="24" width="32" height="32" rx="6"/>
<rect class="tile" x="200" y="64" width="32" height="32" rx="6"/>
<rect class="tile" x="240" y="64" width="32" height="32" rx="6"/>
<rect class="tile" x="280" y="64" width="72" height="32" rx="6"/>
<rect class="tile" x="200" y="104" width="32" height="32" rx="6"/>
<rect class="tile" x="240" y="104" width="32" height="32" rx="6"/>
<rect class="tile" x="280" y="104" width="32" height="32" rx="6"/>
<rect class="tile ok" x="320" y="104" width="32" height="32" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">前端設計系統</h1>
<p class="tag">暖灰底、單一藍色強調，安靜而清楚的介面。</p>
</div>
</div>
</body>
</html>
