<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>FileUpload — preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      var U = window.UI,
        h = React.createElement;
      function D() {
        var s = React.useState([]);
        function add(list) {
          var fs = list.map(function (f, i) {
            return {
              id: Date.now() + i,
              name: f.name,
              size: (f.size / 1048576).toFixed(1) + ' MB',
              progress: 0,
              status: f.size > 104857600 ? 'error' : 'uploading',
              error: f.size > 104857600 ? '超過 100 MB 上限，請壓縮後再試。' : null,
            };
          });
          s[1](function (o) {
            return o.concat(fs);
          });
          fs.forEach(function (f) {
            if (f.status === 'error') return;
            var t = setInterval(function () {
              s[1](function (o) {
                return o.map(function (x) {
                  if (x.id !== f.id) return x;
                  var p = Math.min(100, x.progress + 7);
                  if (p >= 100) clearInterval(t);
                  return Object.assign({}, x, { progress: p, status: p >= 100 ? 'done' : 'uploading' });
                });
              });
            }, 120);
          });
        }
        var demo = function () {
          add([
            { name: 'report-2026-q3.pdf', size: 2516582 },
            { name: 'cluster-photo.jpg', size: 5347737 },
            { name: 'big-dataset.zip', size: 220200960 },
          ]);
        };
        return h(
          'div',
          { style: { padding: 20, display: 'flex', flexDirection: 'column', gap: 10 } },
          h(U.FileUpload, {
            label: '附件',
            limitText: '每個最大 100 MB',
            files: s[0],
            onAdd: add,
            onRemove: function (f) {
              s[1](
                s[0].filter(function (x) {
                  return x.id !== f.id;
                }),
              );
            },
            onRetry: function (f) {
              s[1](
                s[0].filter(function (x) {
                  return x.id !== f.id;
                }),
              );
            },
          }),
          h('div', null, h(U.Button, { variant: 'secondary', onClick: demo }, '放入示範檔')),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(D));
    </script>
  </body>
</html>
