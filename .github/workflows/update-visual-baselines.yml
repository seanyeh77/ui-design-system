# Regenerates the screenshot baselines (tests/visual/baseline) on GitHub's runner, with the same image, browser and
# steps as the compare step in CI, and commits them to the branch it runs on. The recommended way to create or
# update baselines: shots taken on another machine render text slightly differently and fail CI.
# Run it from Actions → Update visual baselines → Run workflow, choosing the branch.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-visual-baselines-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          chromium: 'true'
      # Lossless PNG optimisation (about 35 % smaller files); ui shots uses it when it is on PATH. The prebuilt release
      # binary, checked against its SHA-256, in place of a 2 min cargo build.
      - name: Install oxipng
        env:
          OXIPNG: 10.2.1
          OXIPNG_SHA256: 1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17
        run: |
          name="oxipng-$OXIPNG-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/oxipng.tar.gz" "https://github.com/shssoichiro/oxipng/releases/download/v$OXIPNG/$name.tar.gz"
          echo "$OXIPNG_SHA256  $RUNNER_TEMP/oxipng.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oxipng.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/$name/oxipng" /usr/local/bin/oxipng
          oxipng --version
      - run: pnpm build
      - run: pnpm site
      # Files with the same pixels stay as they are; --prune removes the baselines of removed or renamed previews.
      - run: node packages/cli/dist/cli.js shots site/preview/*.html --out tests/visual/baseline --prune
      - name: Commit the baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A tests/visual/baseline
          if git diff --cached --quiet; then
            echo "基準圖沒有改變。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '更新畫面基準圖'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git diff --stat HEAD~1 HEAD -- tests/visual/baseline | tail -1 >> "$GITHUB_STEP_SUMMARY"
          # A push made with the workflow token starts no workflow: start CI on the new commit.
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
