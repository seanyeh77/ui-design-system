name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Update visual baselines starts this after it commits new baselines (its own push does not start workflows).
  workflow_dispatch:

jobs:
  check:
    # Pinned, like Update visual baselines: the baselines are rendered on this image, and another one renders fonts differently.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @seanyeh77/ui exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The automatic part of "Before you finish" on every component preview.
      - id: site
        run: pnpm site
      - run: node packages/cli/dist/cli.js check site/preview/*.html --wait 400
      # Visual regression: every preview at 390 px and 1280 px, light and dark, against tests/visual/baseline.
      # Runs even when ui check failed, so both reports are there. Intended change: run Update visual baselines.
      - id: visual
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: node packages/cli/dist/cli.js shots site/preview/*.html --compare tests/visual/baseline --diff visual-diff
      - if: ${{ failure() && steps.visual.outcome == 'failure' }}
        run: cat visual-diff/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ failure() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: visual-diff/
          retention-days: 14
