name: CI

# Release (publish.yml) and Docs site (pages.yml) start only after this workflow succeeds on a push to main.
# The two jobs below are the checks to require in the branch protection of main: "check" and "pages". On a push to main
# whose commit already passed both on another branch (ci-shots), the "reuse" job lets them skip: GitHub counts a
# skipped job as passing for required checks, and a run whose jobs are only success or skipped ends as success.
on:
  push:
    branches: [main]
  pull_request:
  # Started by Update visual baselines after it commits new baselines, and by Release on the "Version packages" pull
  # request: a push or a pull request made with the workflow token starts no normal run (see publish.yml).
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request. A new push to a pull request cancels its older run; runs on main always finish,
# because Release waits for their result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Push to main only: is there a finished CI run of this same commit on another branch in which both "check" and
  # "pages" succeeded (ci-shots, where the visual baselines are made)? Then the same commit is not tested a second time.
  # Any error or doubt gives reuse=false, so the full CI runs. Only runs of push and workflow_dispatch count: a
  # pull_request run tests the merge commit, not the head commit. A run on main itself never counts, so a re-run
  # of a reused run does not reuse its own skipped result.
  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          reuse=false
          if ids=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.conclusion == \"success\" and .head_sha == \"$SHA\" and .head_branch != \"main\" and .id != $RUN_ID and (.event == \"push\" or .event == \"workflow_dispatch\")) | .id"); then
            for id in $ids; do
              ok=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                --jq '[.jobs[] | select((.name == "check" or .name == "pages") and .conclusion == "success") | .name] | unique | length' || echo 0)
              if [ "$ok" = 2 ]; then
                reuse=true
                echo "CI run $id of the same commit passed check and pages: they are skipped here." >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            done
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          [ "$reuse" = true ] || echo "No earlier successful run of this commit: the full CI runs." >> "$GITHUB_STEP_SUMMARY"

  # Build, types, lint, unit and browser tests, and the changeset check of pull requests.
  check:
    # Skipped (counts as success) only when reuse said so; the reuse job itself is skipped outside pushes to main.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    # Pinned, like Update visual baselines: the baselines are rendered on this image, and another one renders fonts differently.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changeset status compares the pull request with main: full history on pull requests (0), one commit otherwise.
          # Written this way round because 0 is falsy in expressions: `cond && 0 || 1` would always give 1.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
      - uses: ./.github/actions/setup
        with:
          chromium: 'true'
      # A pull request that changes a published package needs a changeset (pnpm changeset). Changes that need no
      # release (tests only, for example) add an empty one: pnpm changeset --empty. The "Version packages" pull request
      # removes the changesets, so it is not checked.
      - name: Check that changed packages have a changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The automatic part of "Before you finish" on every component preview, and the visual regression check.
  pages:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          chromium: 'true'
      - run: pnpm build
      - id: site
        run: pnpm site
      - run: node packages/cli/dist/cli.js check site/preview/*.html --wait 400
      # Visual regression: every preview at 390 px and 1280 px, light and dark, against tests/visual/baseline.
      # Runs even when ui check failed, so both reports are there. Intended change: run Update visual baselines.
      - id: visual
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: node packages/cli/dist/cli.js shots site/preview/*.html --compare tests/visual/baseline --diff visual-diff
      - if: ${{ failure() && steps.visual.outcome == 'failure' }}
        run: cat visual-diff/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ failure() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: visual-diff/
          retention-days: 14
