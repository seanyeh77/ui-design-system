name: Release

# Changesets opens a "Version packages" pull request; merging it publishes to npm with trusted publishing (OIDC):
# each package lists this repo and publish.yml as its Trusted Publisher on npmjs.com, so no npm token is stored.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node 24 ships npm 11; changeset publish runs pnpm publish, which hands the OIDC exchange to npm >= 11.5.1.
      # No registry-url: it writes an .npmrc that expects NODE_AUTH_TOKEN, which would mask OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm install -g npm@latest
      - name: Check that npm can publish with OIDC
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a*1e6+b*1e3+c < 11005001) { console.error('npm '+process.argv[1]+' cannot use trusted publishing; it needs 11.5.1 or newer.'); process.exit(1) }" "$(npm -v)"
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
