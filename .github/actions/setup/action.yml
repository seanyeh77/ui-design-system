# Shared setup of every workflow: pnpm, Node 22 (the version CI tests with and the release builds with), the locked
# dependencies and, when asked, Chromium for the browser tests, ui check and ui shots.
name: Setup
description: pnpm, Node 22, pnpm install and optionally the Playwright Chromium
inputs:
  chromium:
    description: Install the Playwright Chromium and its system libraries ("true" or "false")
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    # The browser is cached per locked Playwright version (packages/ui and packages/cli pin the same exact version).
    # On a hit only the system libraries are installed, which the cache cannot hold.
    - id: playwright
      if: inputs.chromium == 'true'
      shell: bash
      run: echo "version=$(pnpm --filter @seanyeh77/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - id: playwright-cache
      if: inputs.chromium == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
    - if: inputs.chromium == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @seanyeh77/ui exec playwright install --with-deps chromium
    - if: inputs.chromium == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter @seanyeh77/ui exec playwright install-deps chromium
